    <script>
        // SINTETIZADOR DE AUDIO Y MÚSICA ANIMADA
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMusicPlaying = false;
        let musicTimer = null;

        function toggleMusica() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isMusicPlaying = !isMusicPlaying;
            document.getElementById('music-state').innerText = isMusicPlaying ? 'ON 🎶' : 'OFF';

            if (isMusicPlaying) {
                reproducirLoopMusicaAlegre();
            } else {
                if (musicTimer) clearInterval(musicTimer);
            }
        }

        function reproducirLoopMusicaAlegre() {
            const notas = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 392.00, 523.25];
            let i = 0;
            musicTimer = setInterval(() => {
                if (!isMusicPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = notas[i % notas.length];
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.22);
                i++;
            }, 250);
        }

        function lanzarConfeti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 65,
                    spread: 75,
                    origin: { y: 0.6 },
                    colors: ['#ff007f', '#00f0ff', '#00ff87', '#ffb700', '#8a2be2']
                });
            }
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (type === 'correct') {
                lanzarConfeti();
                const notas = [523.25, 659.25, 783.99, 1046.50];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.setValueAtTime(0.18, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.06) + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.06));
                    osc.stop(audioCtx.currentTime + (idx * 0.06) + 0.22);
                });
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

            const frase = frasesMotivadoras[Math.floor(Math.random() * frasesMotivadoras.length)];

            card.innerHTML = `
                <div class="end-screen-box">
                    <div class="end-title">${titulo}</div>
                    <p style="font-size:13px; color:var(--text-sub);">${descripcion}</p>

                    <div style="background:rgba(10,6,26,0.9); border:1px solid var(--neon-cyan); padding:15px; border-radius:16px; margin:15px 0;">
                        <div style="font-size:14px; font-weight:800; color:var(--gold);">🏆 Puntuación Final: ${puntos} pts</div>
                        <div style="font-size:13px; color:var(--neon-pink); margin-top:4px;">🔥 Máxima Racha: ${racha} aciertos</div>
                    </div>

                    <div class="end-quote">
                        ${frase}
                    </div>

                    <button class="btn-next" onclick="reiniciarJuego()">🔄 Volver a Jugar / Reiniciar Módulos</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarBarra();
            renderExplorador();
        });
    </script>
</body>
</html>
