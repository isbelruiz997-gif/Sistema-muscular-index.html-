<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Sistema Muscular</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #fb7185; margin-bottom: 5px; }
        p { color: #cbd5e1; font-size: 14px; }
        .btn-zone {
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-zone:active { background-color: #be123c; }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .muscle-btn {
            background-color: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
            padding: 8px 12px;
            margin: 4px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .muscle-btn:hover { background-color: #e11d48; }
        #muscle-title { color: #fda4af; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>AnatoMaster Pro</h1>
    <p>Cosmiatría & Estética Corporal</p>

    <div style="margin-top: 15px;">
        <button class="btn-zone" onclick="cargarZona('cara')">Cara y Cuello</button>
        <button class="btn-zone" onclick="cargarZona('abdomen')">Abdomen & Torso</button>
    </div>

    <div class="card">
        <h2 id="muscle-title">Selecciona una Zona</h2>
        <p id="muscle-desc">Toca en uno de los botones superiores para explorar los músculos y su aplicación estética.</p>
        
        <div id="buttons-container" style="margin-top: 15px;"></div>
    </div>

    <script>
        const datos = {
            cara: [
                {
                    nombre: "Orbicular de los Ojos",
                    desc: "Acción: Cierra los párpados. Estética: Tratamiento de patas de gallo y drenaje linfático periocular."
                },
                {
                    nombre: "Corrugador del Supercilio",
                    desc: "Acción: Arruga el ceño. Estética: Zona principal para aplicación de toxina botulínica."
                },
                {
                    nombre: "Masetero",
                    desc: "Acción: Masticación. Estética: Masajes de relajación para bruxismo y perfilado mandibular."
                }
            ],
            abdomen: [
                {
                    nombre: "Recto Abdominal",
                    desc: "Acción: Flexión del tronco. Estética: Tonificación con electroestimulación (ondas rusas)."
                },
                {
                    nombre: "Transverso del Abdomen",
                    desc: "Acción: Comprime el abdomen (faja natural). Estética: Gimnasia hipopresiva y firmeza."
                }
            ]
        };

        function cargarZona(zona) {
            const container = document.getElementById('buttons-container');
            container.innerHTML = '';
            
            datos[zona].forEach((m, index) => {
                const btn = document.createElement('button');
                btn.className = 'muscle-btn';
                btn.innerText = m.nombre;
                btn.onclick = function() {
                    document.getElementById('muscle-title').innerText = m.nombre;
                    document.getElementById('muscle-desc').innerText = m.desc;
                };
                container.appendChild(btn);
                
                if(index === 0) {
                    btn.click();
                }
            });
        }
    </script>
</body>
</html>
