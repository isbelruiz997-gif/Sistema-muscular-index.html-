        :root {
            --bg-dark: #05020a;
            --card-bg: rgba(14, 8, 30, 0.96);

        .app-subtitle {
            font-size: 11px;

            margin: 0 0 10px 0;
        }

        .controls-bar {
            display: flex;

            padding: 6px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;

        .stats-bar {

            padding-bottom: 6px;

        .nav-tabs-scroll::-webkit-scrollbar { display: none; }

        .tab-btn {

        .card {

        .card-header-title {

            padding: 6px 10px;

<body>

    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">Sistema Muscular 3D (Anatomía)</h1>
            <p class="app-subtitle">Módulo Especializado para Cosmiatría y Drenaje Linfático</p>

            <div class="controls-bar">
                <button class="btn-music" onclick="toggleMusica()">🎵 Música: <span id="music-state">OFF</span></button>
                <div class="stats-bar">
                    <div class="stat-badge" style="color: var(--gold);">🏆 <span id="score-val">0</span></div>
                    <div class="stat-badge" style="color: var(--neon-pink);">🔥 <span id="streak-val">0</span></div>
                    <div class="stat-badge" id="lives-val">❤️ ❤️ ❤️</div>
                </div>
            </div>
        </header>

        <div class="nav-tabs-scroll">
            <button class="tab-btn active" id="tab-explorador" onclick="cambiarModo('explorador')">📖 Manual 3D</button>
            <button class="tab-btn" id="tab-trivias" onclick="cambiarModo('trivias')">🎓 Reto (17 Prg)</button>
            <button class="tab-btn" id="tab-ubicacion" onclick="cambiarModo('ubicacion')">🎯 Ubicación (17)</button>
            <button class="tab-btn" id="tab-flashcards" onclick="cambiarModo('flashcards')">🎴 Flashcards</button>
        </div>

        <div class="card" id="app-card"></div>
    </div>

    <script>
        // SINTETIZADOR DE AUDIO
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMusicPlaying = false;
        let musicTimer = null;

        function toggleMusica() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isMusicPlaying = !isMusicPlaying;
            document.getElementById('music-state').innerText = isMusicPlaying ? 'ON 🎶' : 'OFF';

            if (isMusicPlaying) {
                reproducirLoopMusicaAlegre();
            } else {
                if (musicTimer) clearInterval(musicTimer);
            }
        }

        function reproducirLoopMusicaAlegre() {
            const notas = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 392.00, 523.25];
            let i = 0;
            musicTimer = setInterval(() => {
                if (!isMusicPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = notas[i % notas.length];
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.22);
                i++;
            }, 250);
        }

        function lanzarConfeti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff007f', '#00f0ff', '#00ff87', '#ffb700', '#8a2be2']
                });
            }
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (type === 'correct') {
                lanzarConfeti();
                const notas = [523.25, 659.25, 783.99, 1046.50];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.06) + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.06));
                    osc.stop(audioCtx.currentTime + (idx * 0.06) + 0.2);
                });
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // GENERADORES DE GRÁFICOS MÉDICOS CON INDICADORES INCORPORADOS (DATA URI SEGUROS)
        // Esto crea diagramas clínicos limpios en alta resolución que NUNCA se rompen ni fallan.
        function crearSvgAnatomico(titulo, colorAcento) {
            const svgCode = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
                <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0a0518"/>
                        <stop offset="100%" stop-color="#020108"/>
                    </linearGradient>
                    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#7a3e25"/>
                        <stop offset="100%" stop-color="#3d1b0e"/>
                    </linearGradient>
                </defs>
                <rect width="400" height="300" fill="url(#bg)"/>
                <!-- Cuadrícula médica de referencia -->
                <path d="M0 50 H400 M0 100 H400 M0 150 H400 M0 200 H400 M0 250 H400 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300 M300 0 V300 M350 0 V300" stroke="rgba(0,240,255,0.05)" stroke-width="1"/>
                
                <!-- Silueta Anatómica Principal -->
                <g transform="translate(130, 25)">
                    <!-- Cabeza y Torso estilizado de maniquí anatómico -->
                    <ellipse cx="70" cy="35" rx="26" ry="32" fill="url(#body)" stroke="#222" stroke-width="2"/>
                    <path d="M 52 65 C 50 65 35 70 25 85 C 18 95 20 120 28 140 L 45 140 L 50 90 L 70 85 L 90 90 L 95 140 L 112 140 C 120 120 122 95 115 85 C 105 70 90 65 88 65 Z" fill="url(#body)" stroke="#222" stroke-width="2"/>
                </g>

                <!-- Zona muscular destacada con indicador fluorescente -->
                <g transform="translate(160, 95)">
                    <rect x="-15" y="-10" width="60" height="40" rx="8" fill="${colorAcento}" fill-opacity="0.85" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 0 10px ${colorAcento})"/>
                    <text x="15" y="15" font-family="Segoe UI, sans-serif" font-weight="900" font-size="12" fill="#000" text-anchor="middle">ZONA ACTIVA</text>
                </g>

                <!-- Puntero láser / Línea de indicación médica -->
                <line x1="200" y1="125" x2="280" y2="80" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4"/>
                <circle cx="280" cy="80" r="5" fill="#ff007f"/>
                
                <!-- Panel de Leyenda Inferior -->
                <rect x="20" y="240" width="360" height="45" rx="8" fill="rgba(10,5,25,0.9)" stroke="#00f0ff" stroke-width="1.5"/>
                <text x="200" y="260" font-family="Segoe UI, sans-serif" font-weight="900" font-size="14" fill="#00f0ff" text-anchor="middle">${titulo.toUpperCase()}</text>
                <text x="200" y="276" font-family="Segoe UI, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">ATLAS ANATÓMICO 3D • SELECCIÓN CLÍNICA</text>
            </svg>`;
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgCode)));
        }

                {
                    nombre: "Cuádriceps Femoral (Muslo Anterior)",
                    ubicacion: "Toda la cara anterior del muslo.",
                    accion: "Extensión de rodilla.",
                    palpacion: "Extiende la pierna al frente e identifica la rigidez del muslo.",
                    aplicacion: "Masaje reductor de celulitis anterior, drenaje linfático venoso de piernas cansadas.",
                    img: crearSvgAnatomico("Cuádriceps Femoral", "#00f0ff")
                },
                {
                    nombre: "Glúteo Mayor (Pelvis Posterior)",
                    ubicacion: "Masa posterior de la pelvis.",
                    accion: "Extensión y rotación lateral de cadera.",
                    palpacion: "Extiende la pierna hacia atrás y palpa el glúteo.",
                    aplicacion: "Levantamiento glúteo, copas de succión, reafirmación dermal y electroestimulación.",
                    img: crearSvgAnatomico("Glúteo Mayor", "#00ff87")
                }
            ]
        };

        // 17 PREGUNTAS COMPLETAS DEL RETO
        const triviasBanco = [
            { q: "Al realizar Drenaje Linfático Facial y Cervical, ¿qué músculo sirve de guía anterolateral para dirigir la linfa hacia los ganglios de terminus?", opts: ["Esternocleidomastoideo (ECOM)", "Glúteo Mayor", "Recto Abdominal"], cor: 0, exp: "El ECOM recorre diagonalmente el cuello y sirve de guía directa para el Drenaje Linfático." },
            { q: "En un protocolo reductor de cintura con maderoterapia y vacumterapia, ¿qué músculo de los flancos estimulas?", opts: ["Oblicuo Externo", "Masetero", "Deltoides"], cor: 0, exp: "El Oblicuo Externo moldea la pared lateral de la cintura." },
            { q: "Para un lifting facial sin cirugía que eleve pómulos y suavice el surco nasogeniano, ¿qué músculo tratas?", opts: ["Cigomático Mayor", "Temporal", "Cuádriceps"], cor: 0, exp: "El Cigomático Mayor eleva la comisura labial hacia el pómulo." },
            { q: "En el tratamiento del bruxismo y tensión en la mandíbula, ¿qué músculo se descontractura?", opts: ["Masetero", "Orbicular de los Ojos", "Isquiotibiales"], cor: 0, exp: "El Masetero es el elevador mandibular más potente." },
            { q: "Para levantar y tonificar la masa posterior de la pelvis con copas de succión, ¿qué músculo se trabaja?", opts: ["Glúteo Mayor", "Frontal", "Pectoral"], cor: 0, exp: "El Glúteo Mayor es el gran extensor y firmeza de la cadera posterior." },
            { q: "Al realizar un drenaje de piernas cansadas y celulitis anterior del muslo, ¿qué músculo recorres?", opts: ["Cuádriceps Femoral", "Platisma", "ECOM"], cor: 0, exp: "El Cuádriceps ocupa la pared anterior del muslo." },
            { q: "En el tratamiento de la flacidez del brazo en la cara posterior (alas de murciélago), ¿qué músculo tratas?", opts: ["Tríceps Braquial", "Risorio", "Recto Abdominal"], cor: 0, exp: "El Tríceps se ubica en la cara posterior del brazo." },
            { q: "Al aplicar ondas rusas para marcar la pared anterior del abdomen, ¿qué músculo se activa?", opts: ["Recto Abdominal", "Deltoides", "Orbicular"], cor: 0, exp: "El Recto Abdominal flexiona el tronco y define la pared anterior." },
            { q: "Para reafirmar la piel flácida del cuello y escote en radiofrecuencia, ¿qué músculo subcutáneo tratas?", opts: ["Platisma", "Masetero", "Cuádriceps"], cor: 0, exp: "El Platisma recubre la cara anterior del cuello." },
            { q: "En la tonificación del contorno superior del hombro con electroestimulación, ¿qué músculo se activa?", opts: ["Deltoides", "Risorio", "ECOM"], cor: 0, exp: "El Deltoides forma la cúpula muscular del hombro." },
            { q: "Al trabajar la capa profunda del abdomen como faja reductora natural, ¿qué músculo ejercitas?", opts: ["Transverso del Abdomen", "Deltoides", "Temporal"], cor: 0, exp: "El Transverso comprime las vísceras actuando como faja anatómica natural." },
            { q: "Para un masaje relajante craneofacial por tensión en las sienes debido a bruxismo, ¿qué músculo masajeas?", opts: ["Temporal", "Cuádriceps", "Oblicuo"], cor: 0, exp: "El músculo Temporal ocupa la fosa lateral del cráneo." },
            { q: "Al tratar celulitis en la zona posterior del muslo con maderoterapia debajo del pliegue glúteo, ¿qué músculo estimulas?", opts: ["Isquiotibiales", "Masetero", "Pectoral"], cor: 0, exp: "Los Isquiotibiales se extienden en la cara posterior del muslo." },
            { q: "Al tratar líneas verticales del entrecejo con masajes tensores, ¿qué músculo fruncidor relajas?", opts: ["Corrugador del Supercilio", "Glúteo", "Bíceps"], cor: 0, exp: "El Corrugador atrae la ceja hacia la línea media." },
            { q: "Al tratar arrugas perioculares 'patas de gallo' con drenaje linfático, ¿qué músculo esfínter masajeas?", opts: ["Orbicular de los Ojos", "Oblicuo", "Tríceps"], cor: 0, exp: "El Orbicular de los Ojos rodea por completo las órbitas." },
            { q: "Para estimular la firmeza en la cara anterior del brazo con radiofrecuencia, ¿qué músculo tratas?", opts: ["Bíceps Braquial", "Glúteo Mayor", "Frontal"], cor: 0, exp: "El Bíceps Braquial ocupa la cara anterior del brazo." },
            { q: "Al elevar las cejas y suavizar arrugas horizontales en la parte superior del rostro, ¿qué músculo ejercitas?", opts: ["Frontal", "ECOM", "Masetero"], cor: 0, exp: "El músculo Frontal recubre la pared anterior de la frente." }
        ];

        const frasesMotivadoras = [
            "«El conocimiento preciso de la anatomía muscular es el arte invisible detrás de cada tratamiento estético perfecto.»",
            "«Donde las manos conocen las fibras musculares y las cadenas linfáticas, la cosmiatría transforma la salud de la piel.»",
            "«Cada músculo facial cuenta una historia; saber equilibrar su tono es la clave de la belleza consciente y la longevidad.»",
            "«Tus manos son herramientas de precisión cuando las guía la anatomía humana.»"
        ];

        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let modoActual = 'explorador';
        let subZona = 'cara';
        let iTrivia = 0;
        let iUbi = 0;
        let iFlash = 0;
        let respondido = false;

        function actualizarBarra() {
            document.getElementById('score-val').innerText = puntos;
            document.getElementById('streak-val').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-val').innerText = h;
        }

        function reiniciarJuego() {
            puntos = 0;
            racha = 0;
            vidas = 3;
            iTrivia = 0;
            iUbi = 0;
            iFlash = 0;
            actualizarBarra();
            cambiarModo('explorador');
        }

        function cambiarModo(modo) {
            modoActual = modo;
            respondido = false;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${modo}`).classList.add('active');

            if(modo === 'explorador') renderExplorador();
            if(modo === 'trivias') { iTrivia = 0; renderTrivias(); }
            if(modo === 'ubicacion') { iUbi = 0; renderUbicacion(); }
            if(modo === 'flashcards') { iFlash = 0; renderFlashcards(); }
        }

        // MODO 1: EXPLORADOR ANATÓMICO 3D
        function renderExplorador() {
            const card = document.getElementById('app-card');
            const lista = baseAnatomica[subZona];

            let html = `
                <div class="card-header-title">📖 Manual Anatómico 3D</div>
                <div class="card-desc">Selecciona una región corporal para revisar el modelo anatómico y sus aplicaciones clínicas:</div>

                <div class="region-selector">
                    <button class="btn-region ${subZona==='cara'?'active':''}" onclick="subZona='cara'; renderExplorador();">🌸 Cara</button>
                    <button class="btn-region ${subZona==='cuello'?'active':''}" onclick="subZona='cuello'; renderExplorador();">🦒 Cuello</button>
                    <button class="btn-region ${subZona==='abdomen'?'active':''}" onclick="subZona='abdomen'; renderExplorador();">🧍 Abdomen</button>
                    <button class="btn-region ${subZona==='brazos'?'active':''}" onclick="subZona='brazos'; renderExplorador();">💪 Brazos</button>
                    <button class="btn-region ${subZona==='piernas'?'active':''}" onclick="subZona='piernas'; renderExplorador();">🦵 Piernas</button>
                </div>

                <div class="graphic-container">
                    <img id="exp-img" src="${lista[0].img}" alt="${lista[0].nombre}">
                </div>

                <div class="region-selector">
            `;

            lista.forEach((m, idx) => {
                html += `<button class="btn-region" onclick="verDetalleExplorador(${idx})">🔹 ${m.nombre.split(' ')[0]}</button>`;
            });

            html += `</div><div class="info-panel" id="explorador-detail">
                <div class="info-title">${lista[0].nombre}</div>
                <strong>📍 Ubicación Anatómica:</strong> ${lista[0].ubicacion}<br>
                <strong>⚙️ Biomecánica:</strong> ${lista[0].accion}<br>
                <strong>🤚 Cómo Palparlo:</strong> ${lista[0].palpacion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Cosmiátrica & Drenaje:</strong><br>${lista[0].aplicacion}</div>
            </div>`;

            card.innerHTML = html;
        }

        function verDetalleExplorador(idx) {
            const m = baseAnatomica[subZona][idx];
            document.getElementById('exp-img').src = m.img;
            document.getElementById('explorador-detail').innerHTML = `
                <div class="info-title">${m.nombre}</div>
                <strong>📍 Ubicación Anatómica:</strong> ${m.ubicacion}<br>
                <strong>⚙️ Biomecánica:</strong> ${m.accion}<br>
                <strong>🤚 Cómo Palparlo:</strong> ${m.palpacion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Cosmiátrica & Drenaje:</strong><br>${m.aplicacion}</div>
            `;
        }

        // MODO 2: RETO COSRMIÁTRICO (17 PREGUNTAS)
        function renderTrivias() {
            respondido = false;
            const card = document.getElementById('app-card');

            if (iTrivia >= triviasBanco.length) {
                renderCierreFinal("🏆 Master en Anatomía Cosmiátrica", "Has completado con éxito las 17 preguntas del Reto.");
                return;
            }

            const q = triviasBanco[iTrivia];

            let html = `
                <div class="card-header-title">🎓 Reto Cosmiátrico (${iTrivia + 1} de ${triviasBanco.length})</div>
                <div class="card-desc">${q.q}</div>
            `;

            q.opts.forEach((op, idx) => {
                html += `<button class="btn-opt" onclick="evaluarTrivia(${idx === q.cor}, this, ${q.cor})">${op}</button>`;
            });

            html += `
                <div id="fb-trivia" style="margin-top:10px; font-size:12px; display:none;"></div>
                <button class="btn-next" id="btn-next-tr" style="display:none;" onclick="iTrivia++; renderTrivias();">Siguiente Pregunta ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarTrivia(correcto, btn, corIdx) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-trivia');
            const btns = document.querySelectorAll('.btn-opt');
            const q = triviasBanco[iTrivia];

            if(correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                if (racha % 3 === 0 && vidas < 3) vidas++;
                fb.innerHTML = `<span style='color:var(--neon-green); font-weight:bold;'>¡CORRECTO! 🎉</span><br>${q.exp}`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                btns[corIdx].classList.add('correct');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--neon-pink); font-weight:bold;'>Incorrecto ❌</span><br>${q.exp}`;
            }
            actualizarBarra();
            fb.style.display = 'block';

            if (vidas <= 0) {
                setTimeout(() => renderCierreFinal("💔 Examen Finalizado", "Te has quedado sin vidas. ¡Sigue repasando el atlas 3D!"), 1200);
            } else {
                document.getElementById('btn-next-tr').style.display = 'block';
            }
        }

        // MODO 3: DESAFÍO UBICACIÓN (17 PREGUNTAS CON MODELO VISUAL)
        function renderUbicacion() {
            respondido = false;
            const card = document.getElementById('app-card');
            const todos = [...baseAnatomica.cara, ...baseAnatomica.cuello, ...baseAnatomica.abdomen, ...baseAnatomica.brazos, ...baseAnatomica.piernas];

            if (iUbi >= 17) {
                renderCierreFinal("🎯 Especialista en Ubicación Muscular", "Has completado las 17 rondas de identificación anatómica.");
                return;
            }

            const item = todos[iUbi % todos.length];

            let html = `
                <div class="card-header-title">🎯 Desafío Ubicación (${iUbi + 1} de 17)</div>
                <div class="card-desc">Observa el modelo anatómico y reconoce cuál es el músculo indicado:</div>

                <div class="graphic-container">
                    <img src="${item.img}" alt="Modelo Anatómico">
                </div>

                <button class="btn-opt" onclick="evaluarUbi('${item.nombre}', '${item.nombre}', this)">A) ${item.nombre}</button>
                <button class="btn-opt" onclick="evaluarUbi('Incorrecto1', '${item.nombre}', this)">B) Músculo Genérico A</button>
                <button class="btn-opt" onclick="evaluarUbi('Incorrecto2', '${item.nombre}', this)">C) Músculo Genérico B</button>

                <div id="fb-ubi" style="margin-top:10px; font-size:12px; display:none;"></div>
                <button class="btn-next" id="btn-next-ub" style="display:none;" onclick="iUbi++; renderUbicacion();">Siguiente Ubicación ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarUbi(elegido, correcto, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-ubi');

            if(elegido === correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = `<span style='color:var(--neon-green); font-weight:bold;'>¡Correcto!</span> Corresponde exactamente a ${correcto}.`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--neon-pink); font-weight:bold;'>Incorrecto.</span> La respuesta correcta era ${correcto}.`;
            }
            actualizarBarra();
            fb.style.display = 'block';

            if (vidas <= 0) {
                setTimeout(() => renderCierreFinal("💔 Examen Finalizado", "Te has quedado sin vidas en el Desafío Ubicación."), 1200);
            } else {
                document.getElementById('btn-next-ub').style.display = 'block';
            }
        }

        // MODO 4: FLASHCARDS 3D
        function renderFlashcards() {
            const card = document.getElementById('app-card');
            const todos = [...baseAnatomica.cara, ...baseAnatomica.cuello, ...baseAnatomica.abdomen, ...baseAnatomica.brazos, ...baseAnatomica.piernas];
            const item = todos[iFlash % todos.length];

            let html = `
                <div class="card-header-title">🎴 Flashcard 3D (${(iFlash % todos.length) + 1} de ${todos.length})</div>
                <div class="card-desc">Toca la tarjeta para voltearla y revisar su ubicación clínica:</div>

                <div class="flip-card" onclick="this.classList.toggle('flipped')">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="${item.img}" alt="${item.nombre}">
                            <div style="font-size:11px; color:var(--neon-cyan); margin-top:6px;">🔄 Toca para voltear tarjeta</div>
                        </div>
                        <div class="flip-card-back" style="padding: 16px;">
                            <div style="font-weight:900; color:var(--neon-pink); font-size:15px; margin-bottom:6px;">${item.nombre}</div>
                            <div style="font-size:11px; line-height:1.4; color:var(--text-sub);">
                                📍 <strong>Ubicación:</strong> ${item.ubicacion}<br>
                                ⚙️ <strong>Acción:</strong> ${item.accion}<br>
                                ✨ <strong>Cosmiatría:</strong> ${item.aplicacion}
                            </div>
                        </div>
                    </div>
                </div>

                <button class="btn-next" onclick="iFlash++; renderFlashcards();">Siguiente Flashcard ➔</button>
            `;

            card.innerHTML = html;
        }

        // CIERRE FINAL CON ESTADÍSTICAS Y FRASES MOTIVADORAS
        function renderCierreFinal(titulo, descripcion) {
            playSound('correct');
            const card = document.getElementById('app-card');
            const frase = frasesMotivadoras[Math.floor(Math.random() * frasesMotivadoras.length)];

            card.innerHTML = `
                <div class="end-screen-box">
                    <div class="end-title">${titulo}</div>
                    <p style="font-size:12px; color:var(--text-sub);">${descripcion}</p>

                    <div style="background:rgba(10,6,26,0.9); border:1px solid var(--neon-cyan); padding:14px; border-radius:14px; margin:14px 0;">
                        <div style="font-size:14px; font-weight:800; color:var(--gold);">🏆 Puntuación Final: ${puntos} pts</div>
                        <div style="font-size:12px; color:var(--neon-pink); margin-top:4px;">🔥 Máxima Racha: ${racha} aciertos</div>
                    </div>

                    <div class="end-quote">
                        ${frase}
                    </div>

                    <button class="btn-next" onclick="reiniciarJuego()">🔄 Volver al Menú Principal</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarBarra();
            renderExplorador();
        });
    </script>
</body>
</html>
