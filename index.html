<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío AnatomicPro - Estudio de Músculos</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #f43f5e;
            --primary-hover: #e11d48;
            --correct: #10b981;
            --wrong: #ef4444;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #fb7185;
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .score-board {
            background-color: #0f172a;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 5px;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .category-badge {
            background-color: #334155;
            color: #fda4af;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 16px;
            line-height: 1.5;
            font-weight: 600;
            margin-bottom: 18px;
            color: #f1f5f9;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-option {
            background-color: #334155;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-option:active {
            transform: scale(0.98);
        }

        .btn-option.correct {
            background-color: var(--correct) !important;
            border-color: #34d399 !important;
            color: white;
        }

        .btn-option.wrong {
            background-color: var(--wrong) !important;
            border-color: #f87171 !important;
            color: white;
        }

        .explanation-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            font-size: 13px;
            line-height: 1.4;
            display: none;
        }

        .explanation-title {
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 15px;
            cursor: pointer;
            display: none;
        }

        .btn-next:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🧠 AnatomiQuiz Muscular</h1>
            <div class="score-board">Puntos: <span id="score">0</span> / <span id="total-q">0</span></div>
        </header>

        <div class="card" id="quiz-card">
            <span class="category-badge" id="badge-cat">Cargando...</span>
            <div class="question-text" id="q-text">Cargando pregunta...</div>

            <div class="options-grid" id="options-container"></div>

            <div class="explanation-box" id="explanation">
                <div class="explanation-title" id="exp-title">Explicación Anatómica:</div>
                <div id="exp-text"></div>
            </div>

            <button class="btn-next" id="btn-next" onclick="siguientePregunta()">Siguiente Pregunta ➔</button>
        </div>
    </div>

    <script>
        const preguntas = [
            {
                categoria: "Anatomía Facial",
                pregunta: "Si arrugas fuertemente el ceño hacia adentro mostrando molestia o concentración, ¿qué músculo sientes contrayéndose justo encima de las cejas?",
                opciones: [
                    "Corrugador del supercilio",
                    "Orbicular de los ojos",
                    "Masetero",
                    "Cigomático mayor"
                ],
                correcta: 0,
                ubicacion: "Ubicación: Sobre el arco superciliar, profundo al músculo frontal.",
                funcion: "Función: Atrae la ceja hacia adentro y abajo, produciendo las arrugas verticales del entrecejo."
            },
            {
                categoria: "Músculos Corporales",
                pregunta: "Al levantar el brazo lateralmente alejándolo del cuerpo (abducción del hombro), ¿qué músculo principal sientes trabajando en la parte superior del hombro?",
                opciones: [
                    "Pectoral mayor",
                    "Deltoides",
                    "Bíceps braquial",
                    "Dorsal ancho"
                ],
                correcta: 1,
                ubicacion: "Ubicación: Cubre la articulación del hombro en forma de semi-cono.",
                funcion: "Función: Levanta el brazo hacia los lados (abducción), adelante y atrás."
            },
            {
                categoria: "Anatomía Facial & Masticación",
                pregunta: "Aprieta fuertemente los dientes y toca los laterales de tu mandíbula. Sentirás un músculo duro y potente. ¿Cuál es?",
                opciones: [
                    "Platisma",
                    "Orbicular de los labios",
                    "Masetero",
                    "Risorio"
                ],
                correcta: 2,
                ubicacion: "Ubicación: Lateral de la cara, va desde el arco cigomático hasta la mandíbula.",
                funcion: "Función: Eleva la mandíbula con fuerza para la masticación."
            },
            {
                categoria: "Tórax y Abdomen",
                pregunta: "Cuando haces abdominales llevando el pecho hacia las rodillas, ¿qué músculo largo de la pared anterior del abdomen se encarga de flexionar el tronco?",
                opciones: [
                    "Recto abdominal",
                    "Trapecio",
                    "Glúteo mayor",
                    "Platisma"
                ],
                correcta: 0,
                ubicacion: "Ubicación: Pared anterior del abdomen, dividido por la línea alba.",
                funcion: "Función: Flexiona la columna vertebral y comprime la cavidad abdominal."
            },
            {
                categoria: "Cuello y Escote",
                pregunta: "Al girar la cabeza firmemente hacia la derecha, en el lado izquierdo del cuello sobresale un cordón muscular muy marcado. ¿Cómo se llama?",
                opciones: [
                    "Deltoides",
                    "Esternocleidomastoideo (ECOM)",
                    "Frontal",
                    "Sartorio"
                ],
                correcta: 1,
                ubicacion: "Ubicación: Zona anterolateral del cuello, desde el esternón y clavícula hasta la apófisis mastoides.",
                funcion: "Función: Rotación e inclinación de la cabeza, y flexión del cuello."
            },
            {
                categoria: "Extremidades Inferiores",
                pregunta: "Si te pones de pie y extiendes la pierna hacia atrás con fuerza o subes escalones, ¿qué músculo grande y potente en la zona posterior de la cadera se activa?",
                opciones: [
                    "Cuádriceps",
                    "Glúteo mayor",
                    "Gastrocnemio (Gemelo)",
                    "Trapecio"
                ],
                correcta: 1,
                ubicacion: "Ubicación: Región posterior de la pelvis/cadera.",
                funcion: "Función: Principal extensor y rotador externo de la cadera."
            }
        ];

        let indiceActual = 0;
        let puntos = 0;
        let respondido = false;

        function cargarPregunta() {
            respondido = false;
            const q = preguntas[indiceActual];

            document.getElementById('badge-cat').innerText = q.categoria;
            document.getElementById('q-text').innerText = q.pregunta;
            document.getElementById('total-q').innerText = preguntas.length;
            document.getElementById('score').innerText = puntos;

            document.getElementById('explanation').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.opciones.forEach((op, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = `${String.fromCharCode(65 + index)}) ${op}`;
                btn.onclick = () => verificarRespuesta(index, btn);
                container.appendChild(btn);
            });
        }

        function verificarRespuesta(seleccionada, btnElegido) {
            if (respondido) return;
            respondido = true;

            const q = preguntas[indiceActual];
            const botones = document.querySelectorAll('.btn-option');

            if (seleccionada === q.correcta) {
                btnElegido.classList.add('correct');
                puntos++;
                document.getElementById('score').innerText = puntos;
            } else {
                btnElegido.classList.add('wrong');
                botones[q.correcta].classList.add('correct');
            }

            // Mostrar explicación explicativa
            document.getElementById('exp-text').innerHTML = `
                <strong>${q.opciones[q.correcta]}</strong><br>
                📍 <em>${q.ubicacion}</em><br>
                ⚙️ <em>${q.funcion}</em>
            `;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('btn-next').style.display = 'block';
        }

        function siguientePregunta() {
            indiceActual++;
            if (indiceActual < preguntas.length) {
                cargarPregunta();
            } else {
                mostrarResultadoFinal();
            }
        }

        function mostrarResultadoFinal() {
            const card = document.getElementById('quiz-card');
            card.innerHTML = `
                <div style="text-align: center; padding: 10px;">
                    <h2 style="color: #fb7185; margin-bottom: 10px;">🎉 ¡Cuestionario Completado!</h2>
                    <p style="font-size: 16px;">Obtuviste <strong>${puntos}</strong> de <strong>${preguntas.length}</strong> aciertos.</p>
                    <p style="color: var(--subtext); font-size: 13px;">${puntos === preguntas.length ? '¡Excelente! Dominas perfectamente la ubicación y función muscular.' : '¡Buen intento! Puedes volver a repasar para afianzar tus conocimientos.'}</p>
                    <button class="btn-next" style="display:block;" onclick="location.reload()">Reiniciar Test 🔄</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', cargarPregunta);
    </script>
</body>
</html>
