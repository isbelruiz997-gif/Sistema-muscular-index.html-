<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoCosmiatría ESTÉTICA PRO</title>
    <style>
        :root {
            --bg-dark: #070a14;
            --card-bg: #0f1629;
            --primary-pink: #e11d48;
            --primary-pink-hover: #be123c;
            --accent-cyan: #38bdf8;
            --accent-purple: #818cf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
            --correct: #10b981;
            --wrong: #ef4444;
            --gold: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
        }

        /* HEADER & DASHBOARD */
        .app-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .app-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 800;
            color: #fb7185;
            margin: 0;
        }

        .badge-pro {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid #059669;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .app-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            margin: 4px 0 12px 0;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: #0d1322;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            margin: 0 auto 15px auto;
            width: fit-content;
        }

        .stat-badge {
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* NAVEGACIÓN DE PESTAÑAS (TABS) */
        .nav-tabs-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .nav-tabs-scroll::-webkit-scrollbar { display: none; }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--primary-pink);
            color: white;
            border-color: #f43f5e;
            box-shadow: 0 0 12px rgba(225, 29, 72, 0.4);
        }

        /* TARJETA PRINCIPAL */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .card-header-title {
            font-size: 18px;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* BOTONES DE REGION */
        .region-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn-region {
            background-color: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-region.active {
            background-color: #831843;
            border-color: #f43f5e;
            color: #fbcfe8;
        }

        /* GRÁFICO ANATÓMICO CON MARCADORES */
        .graphic-container {
            width: 100%;
            height: 220px;
            background: #070d19;
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        /* DETALLE MUSCULAR EXCLUSIVO */
        .info-panel {
            background-color: #0b1120;
            border-left: 4px solid var(--accent-cyan);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.45;
        }

        .info-title {
            font-weight: 800;
            color: #38bdf8;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .badge-cosmiatria {
            background-color: rgba(225, 29, 72, 0.15);
            border: 1px solid var(--primary-pink);
            color: #fda4af;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 12px;
        }

        /* COMPONENTES DE QUIZ Y FLASHCARDS */
        .btn-opt {
            background-color: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .btn-opt.correct { background-color: var(--correct) !important; color: white; }
        .btn-opt.wrong { background-color: var(--wrong) !important; color: white; }

        .btn-next {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* TARGETA GIRATORIA (FLASHCARD) */
        .flashcard-box {
            background-color: #1a2336;
            border: 2px stroke var(--accent-cyan);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER PRINCIPAL -->
        <header class="app-header">
            <div class="app-title-container">
                <h1 class="app-title">AnatoCosmiatría</h1>
                <span class="badge-pro">ESTÉTICA PRO</span>
            </div>
            <p class="app-subtitle">Anatomía Muscular para Cosmetología, Cosmiatría y Estética Corporal</p>

            <div class="stats-bar">
                <div class="stat-badge" style="color: var(--gold);">🏆 <span id="score-val">0</span></div>
                <div class="stat-badge" style="color: #f43f5e;">🔥 <span id="streak-val">0</span></div>
                <div class="stat-badge" id="lives-val">❤️ ❤️ ❤️</div>
            </div>
        </header>

        <!-- NAVEGACIÓN POR PESTAÑAS (MODOS) -->
        <div class="nav-tabs-scroll">
            <button class="tab-btn active" id="tab-explorador" onclick="cambiarModo('explorador')">🖐️ Explorador</button>
            <button class="tab-btn" id="tab-trivias" onclick="cambiarModo('trivias')">🎓 Trivias (3 Módulos)</button>
            <button class="tab-btn" id="tab-ubicacion" onclick="cambiarModo('ubicacion')">🎯 Desafío Ubicación</button>
            <button class="tab-btn" id="tab-flashcards" onclick="cambiarModo('flashcards')">🎴 Flashcards</button>
        </div>

        <!-- CONTENIDO DINÁMICO DE LA APLICACIÓN -->
        <div class="card" id="app-card"></div>
    </div>

    <script>
        // SINTETIZADOR DE AUDIO
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (type === 'correct') {
                const notas = [523.25, 659.25, 783.99, 1046.50];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.07));
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + (idx * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.07) + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.07));
                    osc.stop(audioCtx.currentTime + (idx * 0.07) + 0.2);
                });
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // BASE DE DATOS EXTENSA Y PROFUNDA
        const baseAnatomica = {
            cara: [
                {
                    nombre: "Masetero",
                    ubicacion: "Arco cigomático hasta el ángulo posterior de la mandíbula.",
                    accion: "Potente elevador de la mandíbula (oclusión y masticación).",
                    aplicacion: "Hipertrofia por bruxismo. Punto clave para masajes descontracturantes faciales y perfilado.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100">
                        <path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#38bdf8" stroke-width="2" fill="none"/>
                        <rect x="58" y="50" width="14" height="22" rx="3" fill="#e11d48" stroke="#fb7185"/>
                        <circle cx="42" cy="38" r="3" fill="#fff"/><circle cx="58" cy="38" r="3" fill="#fff"/>
                    </svg>`
                },
                {
                    nombre: "Orbicular de los Ojos",
                    ubicacion: "Esfínter muscular completo alrededor de las órbitas oculares.",
                    accion: "Cierra los párpados y promueve el drenaje de la lágrima.",
                    aplicacion: "Formación de 'patas de gallo'. Tratamiento con drenaje linfático periocular y toxina botulínica.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100">
                        <path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#38bdf8" stroke-width="2" fill="none"/>
                        <circle cx="42" cy="38" r="10" stroke="#e11d48" stroke-width="3" fill="none"/>
                        <circle cx="58" cy="38" r="10" stroke="#e11d48" stroke-width="3" fill="none"/>
                    </svg>`
                },
                {
                    nombre: "Cigomático Mayor",
                    ubicacion: "Desde el hueso cigomático (pómulo) a la comisura labial.",
                    accion: "Eleva y tracciona la comisura labial lateralmente (sonrisa).",
                    aplicacion: "Elevación de pómulos, prevención del surco nasogeniano y maderoterapia facial.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100">
                        <path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#38bdf8" stroke-width="2" fill="none"/>
                        <path d="M 60 42 L 52 65" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>
                    </svg>`
                }
            ],
            torso: [
                {
                    nombre: "Recto Abdominal",
                    ubicacion: "Pared anterior del abdomen, dividido por la línea alba.",
                    accion: "Flexión de la columna vertebral y compresión visceral.",
                    aplicacion: "Tonificación con electroestimulación (ondas rusas), cavitación y diástasis abdominal.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100">
                        <path d="M 35 15 L 65 15 L 60 85 L 40 85 Z" stroke="#38bdf8" stroke-width="2" fill="none"/>
                        <rect x="42" y="30" width="16" height="45" rx="3" fill="#e11d48"/>
                    </svg>`
                },
                {
                    nombre: "Deltoides",
                    ubicacion: "Cúpula superior del hombro.",
                    accion: "Abducción del brazo y elevación lateral.",
                    aplicacion: "Protocolos de tonificación corporal y moldeado de brazos.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100">
                        <path d="M 30 20 L 70 20 L 75 80 L 25 80 Z" stroke="#38bdf8" stroke-width="2" fill="none"/>
                        <path d="M 22 25 Q 32 15 38 25 L 28 48 Z" fill="#e11d48"/>
                    </svg>`
                }
            ]
        };

        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let modoActual = 'explorador';
        let subZona = 'cara';
        let iFlashcard = 0;
        let respondido = false;

        function actualizarBarra() {
            document.getElementById('score-val').innerText = puntos;
            document.getElementById('streak-val').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-val').innerText = h;
        }

        function cambiarModo(modo) {
            modoActual = modo;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${modo}`).classList.add('active');

            if(modo === 'explorador') renderExplorador();
            if(modo === 'trivias') renderTrivias();
            if(modo === 'ubicacion') renderUbicacion();
            if(modo === 'flashcards') renderFlashcards();
        }

        // --- MODO 1: EXPLORADOR ---
        function renderExplorador() {
            const card = document.getElementById('app-card');
            const lista = baseAnatomica[subZona];

            let html = `
                <div class="card-header-title">🖐️ Explorador Muscular Cosmiátrico</div>
                <div class="card-desc">Selecciona un músculo para ver su aplicación en masajes, lifting, aparatología y tratamiento estético.</div>

                <div class="region-selector">
                    <button class="btn-region ${subZona==='cara'?'active':''}" onclick="setSubZona('cara')">🌸 Cara y Cuello 🌟</button>
                    <button class="btn-region ${subZona==='torso'?'active':''}" onclick="setSubZona('torso')">🧍 Abdomen & Torso 🌟</button>
                </div>

                <div class="graphic-container">
                    ${lista[0].svg}
                </div>

                <div class="region-selector">
            `;

            lista.forEach((m, idx) => {
                html += `<button class="btn-region" onclick="verDetalleExplorador(${idx})">🔹 ${m.nombre}</button>`;
            });

            html += `</div><div class="info-panel" id="explorador-detail">
                <div class="info-title">${lista[0].nombre}</div>
                <strong>📍 Ubicación:</strong> ${lista[0].ubicacion}<br>
                <strong>⚙️ Acción:</strong> ${lista[0].accion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Cosmiátrica:</strong><br>${lista[0].aplicacion}</div>
            </div>`;

            card.innerHTML = html;
        }

        function setSubZona(z) {
            subZona = z;
            renderExplorador();
        }

        function verDetalleExplorador(idx) {
            const m = baseAnatomica[subZona][idx];
            document.querySelector('.graphic-container').innerHTML = m.svg;
            document.getElementById('explorador-detail').innerHTML = `
                <div class="info-title">${m.nombre}</div>
                <strong>📍 Ubicación:</strong> ${m.ubicacion}<br>
                <strong>⚙️ Acción:</strong> ${m.accion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Cosmiátrica:</strong><br>${m.aplicacion}</div>
            `;
        }

        // --- MODO 2: TRIVIAS ---
        function renderTrivias() {
            respondido = false;
            const card = document.getElementById('app-card');
            card.innerHTML = `
                <div class="card-header-title">🎓 Trivia Cosmiátrica</div>
                <div class="card-desc">Al realizar un tratamiento de lifting facial para elevar pómulos y definir comisuras labiales, ¿qué músculo principal estás estimulando?</div>

                <button class="btn-opt" onclick="evaluarTrivia(true, this)">A) Cigomático Mayor</button>
                <button class="btn-opt" onclick="evaluarTrivia(false, this)">B) Masetero</button>
                <button class="btn-opt" onclick="evaluarTrivia(false, this)">C) Trapecio</button>

                <div id="fb-trivia" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-tr" style="display:none;" onclick="renderTrivias()">Siguiente Pregunta ➔</button>
            `;
        }

        function evaluarTrivia(correcto, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-trivia');

            if(correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = "<span style='color:var(--correct); font-weight:bold;'>¡Correcto!</span> El Cigomático Mayor eleva las comisuras de la boca.";
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = "<span style='color:var(--wrong); font-weight:bold;'>Incorrecto.</span> Revisa el módulo de Cara y Cuello.";
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-tr').style.display = 'block';
        }

        // --- MODO 3: DESAFÍO UBICACIÓN ---
        function renderUbicacion() {
            const card = document.getElementById('app-card');
            card.innerHTML = `
                <div class="card-header-title">🎯 Desafío Ubicación</div>
                <div class="card-desc">Toca en la zona resalta en rojo del diagrama para identificar su nombre:</div>

                <div class="graphic-container">
                    <svg width="120" height="120" viewBox="0 0 100 100">
                        <path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#38bdf8" stroke-width="2" fill="none"/>
                        <rect x="58" y="50" width="14" height="22" rx="3" fill="#e11d48" stroke="#fb7185"/>
                    </svg>
                </div>

                <button class="btn-opt" onclick="evaluarUbi(true, this)">Masetero</button>
                <button class="btn-opt" onclick="evaluarUbi(false, this)">Frontal</button>
                <button class="btn-opt" onclick="evaluarUbi(false, this)">Deltoides</button>

                <div id="fb-ubi" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-ub" style="display:none;" onclick="renderUbicacion()">Siguiente Ubicación ➔</button>
            `;
        }

        function evaluarUbi(cor, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-ubi');

            if(cor) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = "<span style='color:var(--correct); font-weight:bold;'>¡Correcto!</span> Es el Masetero en la mandíbula.";
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = "<span style='color:var(--wrong); font-weight:bold;'>Incorrecto.</span>";
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-ub').style.display = 'block';
        }

        // --- MODO 4: FLASHCARDS ---
        function renderFlashcards() {
            const card = document.getElementById('app-card');
            const item = baseAnatomica.cara[iFlashcard % baseAnatomica.cara.length];

            card.innerHTML = `
                <div class="card-header-title">🎴 Flashcards (Descubre el Músculo)</div>
                <div class="card-desc">Observa la ilustración anatómica y selecciona el nombre correspondiente:</div>

                <div class="flashcard-box">
                    ${item.svg}
                </div>

                <button class="btn-opt" onclick="evaluarFlash('${item.nombre}', '${item.nombre}', this)">${item.nombre}</button>
                <button class="btn-opt" onclick="evaluarFlash('Deltoides', '${item.nombre}', this)">Deltoides</button>
                <button class="btn-opt" onclick="evaluarFlash('Recto Abdominal', '${item.nombre}', this)">Recto Abdominal</button>

                <div id="fb-flash" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-fl" style="display:none;" onclick="iFlashcard++; renderFlashcards();">Siguiente Flashcard ➔</button>
            `;
        }

        function evaluarFlash(elegido, correcto, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-flash');

            if(elegido === correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = `<span style='color:var(--correct); font-weight:bold;'>¡Correcto!</span> Acertaste la tarjeta.`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--wrong); font-weight:bold;'>Incorrecto.</span> Era ${correcto}.`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-fl').style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarBarra();
            renderExplorador();
        });
    </script>
</body>
</html>
