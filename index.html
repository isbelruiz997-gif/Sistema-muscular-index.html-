<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoCosmiatría ESTÉTICA PRO Neon</title>
    <style>
        :root {
            --bg-dark: #05020a;
            --card-bg: rgba(18, 10, 36, 0.92);
            --neon-pink: #ff007f;
            --neon-cyan: #00f0ff;
            --neon-green: #00ff87;
            --neon-purple: #8a2be2;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --border: rgba(0, 240, 255, 0.25);
            --gold: #ffb700;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(-45deg, #05020a, #120524, #1a0033, #021224);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            width: 100%;
            max-width: 520px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .app-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 15px var(--neon-pink);
            margin: 0;
        }

        .badge-pro {
            background-color: rgba(0, 255, 135, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .app-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            margin: 4px 0 10px 0;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 6, 26, 0.85);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
        }

        .btn-music {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .stats-bar {
            display: flex;
            gap: 12px;
        }

        .stat-badge {
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-tabs-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }

        .nav-tabs-scroll::-webkit-scrollbar { display: none; }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }

        .card-header-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 15px;
            line-height: 1.45;
        }

        .region-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn-region {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-region.active {
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            border-color: var(--neon-pink);
            color: white;
            box-shadow: 0 0 12px var(--neon-pink);
        }

        .graphic-container {
            width: 100%;
            height: 230px;
            background: rgba(5, 2, 15, 0.9);
            border: 1px solid var(--neon-cyan);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .info-panel {
            background-color: rgba(10, 6, 26, 0.85);
            border-left: 4px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .info-title {
            font-weight: 900;
            color: var(--neon-pink);
            font-size: 16px;
            margin-bottom: 6px;
            text-shadow: 0 0 8px var(--neon-pink);
        }

        .badge-cosmiatria {
            background-color: rgba(255, 0, 127, 0.15);
            border: 1px solid var(--neon-pink);
            color: #ff75c3;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 12px;
        }

        .btn-opt {
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .btn-opt.correct {
            background: linear-gradient(90deg, #00b09b, #96c93d) !important;
            border-color: var(--neon-green) !important;
            color: #000;
            font-weight: 800;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-opt.wrong {
            background: linear-gradient(90deg, #ff0055, #ff5252) !important;
            border-color: #ff5252 !important;
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }

        .btn-next {
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 14px;
            margin-top: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .flashcard-box {
            background-color: rgba(10, 6, 26, 0.9);
            border: 2px solid var(--neon-cyan);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="app-title-container">
                <h1 class="app-title">AnatoCosmiatría</h1>
                <span class="badge-pro">ESTÉTICA PRO</span>
            </div>
            <p class="app-subtitle">Anatomía Muscular para Cosmetología, Cosmiatría y Estética Corporal</p>

            <div class="controls-bar">
                <button class="btn-music" onclick="toggleMusica()">🎵 Música: <span id="music-state">OFF</span></button>
                <div class="stats-bar">
                    <div class="stat-badge" style="color: var(--gold);">🏆 <span id="score-val">0</span></div>
                    <div class="stat-badge" style="color: var(--neon-pink);">🔥 <span id="streak-val">0</span></div>
                    <div class="stat-badge" id="lives-val">❤️ ❤️ ❤️</div>
                </div>
            </div>
        </header>

        <div class="nav-tabs-scroll">
            <button class="tab-btn active" id="tab-explorador" onclick="cambiarModo('explorador')">🖐️ Explorador</button>
            <button class="tab-btn" id="tab-trivias" onclick="cambiarModo('trivias')">🎓 Trivias (12 Prg)</button>
            <button class="tab-btn" id="tab-ubicacion" onclick="cambiarModo('ubicacion')">🎯 Ubicación (12 Prg)</button>
            <button class="tab-btn" id="tab-flashcards" onclick="cambiarModo('flashcards')">🎴 Flashcards (12 Prg)</button>
        </div>

        <div class="card" id="app-card"></div>
    </div>

    <script>
        // SINTETIZADOR DE AUDIO Y MÚSICA DE FONDO
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMusicPlaying = false;
        let musicTimer = null;

        function toggleMusica() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isMusicPlaying = !isMusicPlaying;
            document.getElementById('music-state').innerText = isMusicPlaying ? 'ON 🎶' : 'OFF';

            if (isMusicPlaying) {
                reproducirLoopMusica();
            } else {
                if (musicTimer) clearInterval(musicTimer);
            }
        }

        function reproducirLoopMusica() {
            const notas = [261.63, 293.66, 329.63, 392.00, 440.00];
            let i = 0;
            musicTimer = setInterval(() => {
                if (!isMusicPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = notas[i % notas.length];
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
                i++;
            }, 500);
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (type === 'correct') {
                const notas = [523.25, 659.25, 783.99, 1046.50];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.07));
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + (idx * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.07) + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.07));
                    osc.stop(audioCtx.currentTime + (idx * 0.07) + 0.2);
                });
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // BASE DE DATOS COMPLETA: CARA, ABDOMEN, GLÚTEOS Y PIERNAS
        const baseAnatomica = {
            cara: [
                {
                    nombre: "Masetero",
                    ubicacion: "Arco cigomático hasta el ángulo posterior de la mandíbula.",
                    accion: "Potente elevador mandibular (masticación y oclusión).",
                    aplicacion: "Hipertrofia por bruxismo y masajes descontracturantes faciales.",
                    svg: `<svg width="140" height="140" viewBox="0 0 100 100">
                        <path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#00f0ff" stroke-width="2" fill="none"/>
                        <rect x="58" y="50" width="14" height="22" rx="3" fill="#ff007f" stroke="#00ff87" stroke-width="1.5"/>
                        <circle cx="42" cy="38" r="3" fill="#fff"/><circle cx="58" cy="38" r="3" fill="#fff"/>
                    </svg>`
                },
                {
                    nombre: "Orbicular de los Ojos",
                    ubicacion: "Esfínter muscular circular alrededor de las órbitas oculares.",
                    accion: "Cierra los párpados y promueve el drenaje lagrimal.",
                    aplicacion: "Tratamiento de patas de gallo y drenaje linfático periocular.",
                    svg: `<svg width="140" height="140" viewBox="0 0 100 100">
                        <path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#00f0ff" stroke-width="2" fill="none"/>
                        <circle cx="42" cy="38" r="10" stroke="#ff007f" stroke-width="3" fill="none"/>
                        <circle cx="58" cy="38" r="10" stroke="#ff007f" stroke-width="3" fill="none"/>
                    </svg>`
                },
                {
                    nombre: "Cigomático Mayor",
                    ubicacion: "Desde el hueso pómulo a la comisura labial.",
                    accion: "Eleva la comisura labial (sonrisa).",
                    aplicacion: "Lifting facial, prevención de surco nasogeniano y maderoterapia.",
                    svg: `<svg width="140" height="140" viewBox="0 0 100 100">
                        <path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#00f0ff" stroke-width="2" fill="none"/>
                        <path d="M 60 42 L 52 65" stroke="#ff007f" stroke-width="4" stroke-linecap="round"/>
                    </svg>`
                },
                {
                    nombre: "Corrugador del Supercilio",
                    ubicacion: "Zona medial del arco superciliar.",
                    accion: "Frunce el ceño hacia adentro.",
                    aplicacion: "Tratamiento de arrugas del entrecejo (líneas glabelares).",
                    svg: `<svg width="140" height="140" viewBox="0 0 100 100">
                        <path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#00f0ff" stroke-width="2" fill="none"/>
                        <path d="M 38 32 Q 44 32 46 35 M 62 32 Q 56 32 54 35" stroke="#ff007f" stroke-width="4"/>
                    </svg>`
                }
            ],
            corporal: [
                {
                    nombre: "Recto Abdominal",
                    ubicacion: "Pared anterior del abdomen, dividido por la línea alba.",
                    accion: "Flexión de tronco y compresión visceral.",
                    aplicacion: "Electroestimulación (ondas rusas), cavitación y tratamiento de diástasis.",
                    svg: `<svg width="140" height="140" viewBox="0 0 100 100">
                        <path d="M 35 15 L 65 15 L 60 85 L 40 85 Z" stroke="#00f0ff" stroke-width="2" fill="none"/>
                        <rect x="42" y="30" width="16" height="45" rx="3" fill="#ff007f" stroke="#00ff87" stroke-width="1.5"/>
                    </svg>`
                },
                {
                    nombre: "Oblicuo Externo",
                    ubicacion: "Pared anterolateral del abdomen y cintura.",
                    accion: "Inclinación lateral y rotación del tronco.",
                    aplicacion: "Masajes reductores de cintura, moldeo con maderoterapia y vacumterapia.",
                    svg: `<svg width="140" height="140" viewBox="0 0 100 100">
                        <path d="M 35 15 L 65 15 L 60 85 L 40 85 Z" stroke="#00f0ff" stroke-width="2" fill="none"/>
                        <path d="M 35 35 L 42 70 M 65 35 L 58 70" stroke="#ff007f" stroke-width="4"/>
                    </svg>`
                },
                {
                    nombre: "Cuádriceps Femoral",
                    ubicacion: "Cara anterior del muslo.",
                    accion: "Extensión de rodilla y flexión de cadera.",
                    aplicacion: "Masaje reductor de muslos, reafirmación tisular y drenaje de piernas cansadas.",
                    svg: `<svg width="140" height="140" viewBox="0 0 100 100">
                        <path d="M 30 10 L 70 10 L 65 90 L 35 90 Z" stroke="#00f0ff" stroke-width="2" fill="none"/>
                        <rect x="38" y="25" width="24" height="50" rx="4" fill="#ff007f"/>
                    </svg>`
                },
                {
                    nombre: "Glúteo Mayor",
                    ubicacion: "Región posterior de la pelvis.",
                    accion: "Extensión y rotación lateral de cadera.",
                    aplicacion: "Levantamiento de glúteos, copas de succión, reafirmación y electroestimulación.",
                    svg: `<svg width="140" height="140" viewBox="0 0 100 100">
                        <path d="M 30 20 L 70 20 L 75 80 L 25 80 Z" stroke="#00f0ff" stroke-width="2" fill="none"/>
                        <circle cx="40" cy="55" r="14" fill="#ff007f"/><circle cx="60" cy="55" r="14" fill="#ff007f"/>
                    </svg>`
                },
                {
                    nombre: "Isquiotibiales (Bíceps Femoral)",
                    ubicacion: "Cara posterior del muslo.",
                    accion: "Flexión de rodilla y extensión de cadera.",
                    aplicacion: "Tratamiento reductor de celulitis posterior, maderoterapia y moldeado.",
                    svg: `<svg width="140" height="140" viewBox="0 0 100 100">
                        <path d="M 30 10 L 70 10 L 65 90 L 35 90 Z" stroke="#00f0ff" stroke-width="2" fill="none"/>
                        <rect x="40" y="30" width="8" height="45" fill="#ff007f"/>
                        <rect x="52" y="30" width="8" height="45" fill="#ff007f"/>
                    </svg>`
                }
            ]
        };

        const triviasBanco = [
            { q: "Al realizar un masaje reductor de cintura para moldear la silueta, ¿qué músculo lateral del abdomen trabajas principalmente?", opts: ["Oblicuo Externo", "Masetero", "Trapecio"], cor: 0, exp: "El Oblicuo Externo moldea los laterales de la cintura." },
            { q: "Para un protocolo de reafirmación glútea con copas de succión y ondas rusas, ¿qué músculo principal se estimula?", opts: ["Glúteo Mayor", "Cuádriceps", "Frontal"], cor: 0, exp: "El Glúteo Mayor es el gran extensor y tonificador de la pelvis posterior." },
            { q: "Al trabajar un tratamiento reductor de celulitis en la cara anterior del muslo, ¿sobre qué grupo muscular actúas?", opts: ["Cuádriceps Femoral", "Recto Abdominal", "Cigomático"], cor: 0, exp: "El Cuádriceps ocupa la pared anterior del muslo." },
            { q: "En un protocolo de lifting facial para elevar pómulos, ¿qué músculo es fundamental estimular?", opts: ["Cigomático Mayor", "Masetero", "Isquiotibiales"], cor: 0, exp: "El Cigomático Mayor eleva las comisuras al sonreír." },
            { q: "Para aliviar la tensión por bruxismo en la zona mandibular, ¿qué músculo se descontractura?", opts: ["Masetero", "Orbicular de los ojos", "Oblicuo"], cor: 0, exp: "El Masetero es el músculo elevador principal de la masticación." },
            { q: "¿Qué músculo actúa como 'faja anatómica' profunda comprimiendo el abdomen en tratamientos reductores?", opts: ["Transverso del Abdomen", "Deltoides", "Glúteo"], cor: 0, exp: "El Transverso comprime la pared abdominal profunda." },
            { q: "Al tratar celulitis en la zona posterior del muslo con maderoterapia, ¿qué grupo muscular se recorre?", opts: ["Isquiotibiales", "Frontal", "Pectoral"], cor: 0, exp: "Los Isquiotibiales se ubican en la parte posterior del muslo." },
            { q: "¿Qué músculo orbicular rodea los ojos y es diana de tratamientos para patas de gallo?", opts: ["Orbicular de los Ojos", "Corrugador", "Masetero"], cor: 0, exp: "El Orbicular de los Ojos es el esfínter periocular." },
            { q: "Al aplicar electroestimulación en el abdomen para marcar la línea alba, ¿qué músculo trabaja?", opts: ["Recto Abdominal", "Cuádriceps", "ECOM"], cor: 0, exp: "El Recto Abdominal flexiona el tronco y marca el abdomen." },
            { q: "Para un masaje descontracturante en cuello y drenaje linfático, ¿qué músculo guía la zona anterolateral?", opts: ["Esternocleidomastoideo (ECOM)", "Glúteo", "Oblicuo"], cor: 0, exp: "El ECOM recorre diagonalmente el cuello." },
            { q: "¿Qué músculo del entrecejo se frunce al concentrarse generando líneas verticales?", opts: ["Corrugador del Supercilio", "Risorio", "Deltoides"], cor: 0, exp: "El Corrugador junta las cejas hacia la línea media." },
            { q: "Al realizar un masaje reductor en hombros y cúpula del brazo, ¿qué músculo se estimula?", opts: ["Deltoides", "Bucinador", "Masetero"], cor: 0, exp: "El Deltoides forma el capuchón del hombro." }
        ];

        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let modoActual = 'explorador';
        let subZona = 'cara';
        let iTrivia = 0;
        let iUbi = 0;
        let iFlash = 0;
        let respondido = false;

        function actualizarBarra() {
            document.getElementById('score-val').innerText = puntos;
            document.getElementById('streak-val').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-val').innerText = h;
        }

        function cambiarModo(modo) {
            modoActual = modo;
            respondido = false;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${modo}`).classList.add('active');

            if(modo === 'explorador') renderExplorador();
            if(modo === 'trivias') { iTrivia = 0; renderTrivias(); }
            if(modo === 'ubicacion') { iUbi = 0; renderUbicacion(); }
            if(modo === 'flashcards') { iFlash = 0; renderFlashcards(); }
        }

        // MODO 1: EXPLORADOR
        function renderExplorador() {
            const card = document.getElementById('app-card');
            const lista = baseAnatomica[subZona];

            let html = `
                <div class="card-header-title">🖐️ Explorador Muscular Cosmiátrico</div>
                <div class="card-desc">Selecciona una región y un músculo para revisar su aplicación reductora, reafirmante o facial.</div>

                <div class="region-selector">
                    <button class="btn-region ${subZona==='cara'?'active':''}" onclick="subZona='cara'; renderExplorador();">🌸 Cara y Cuello</button>
                    <button class="btn-region ${subZona==='corporal'?'active':''}" onclick="subZona='corporal'; renderExplorador();">🦵 Abdomen, Glúteos y Piernas</button>
                </div>

                <div class="graphic-container">${lista[0].svg}</div>

                <div class="region-selector">
            `;

            lista.forEach((m, idx) => {
                html += `<button class="btn-region" onclick="verDetalleExplorador(${idx})">🔹 ${m.nombre}</button>`;
            });

            html += `</div><div class="info-panel" id="explorador-detail">
                <div class="info-title">${lista[0].nombre}</div>
                <strong>📍 Ubicación:</strong> ${lista[0].ubicacion}<br>
                <strong>⚙️ Acción:</strong> ${lista[0].accion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Estética / Reductora:</strong><br>${lista[0].aplicacion}</div>
            </div>`;

            card.innerHTML = html;
        }

        function verDetalleExplorador(idx) {
            const m = baseAnatomica[subZona][idx];
            document.querySelector('.graphic-container').innerHTML = m.svg;
            document.getElementById('explorador-detail').innerHTML = `
                <div class="info-title">${m.nombre}</div>
                <strong>📍 Ubicación:</strong> ${m.ubicacion}<br>
                <strong>⚙️ Acción:</strong> ${m.accion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Estética / Reductora:</strong><br>${m.aplicacion}</div>
            `;
        }

        // MODO 2: TRIVIAS (12 PREGUNTAS)
        function renderTrivias() {
            respondido = false;
            const card = document.getElementById('app-card');
            const q = triviasBanco[iTrivia % triviasBanco.length];

            let html = `
                <div class="card-header-title">🎓 Trivia Cosmiátrica (${iTrivia + 1} de ${triviasBanco.length})</div>
                <div class="card-desc">${q.q}</div>
            `;

            q.opts.forEach((op, idx) => {
                html += `<button class="btn-opt" onclick="evaluarTrivia(${idx === q.cor}, this, ${q.cor})">${op}</button>`;
            });

            html += `
                <div id="fb-trivia" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-tr" style="display:none;" onclick="siguienteTrivia()">Siguiente Pregunta ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarTrivia(correcto, btn, corIdx) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-trivia');
            const btns = document.querySelectorAll('.btn-opt');
            const q = triviasBanco[iTrivia % triviasBanco.length];

            if(correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                if (racha % 3 === 0 && vidas < 3) vidas++;
                fb.innerHTML = `<span style='color:var(--neon-green); font-weight:bold;'>¡Correcto! 🎉</span><br>${q.exp}`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                btns[corIdx].classList.add('correct');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--neon-pink); font-weight:bold;'>Incorrecto ❌</span><br>${q.exp}`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-tr').style.display = 'block';
        }

        function siguienteTrivia() {
            iTrivia++;
            renderTrivias();
        }

        // MODO 3: DESAFÍO UBICACIÓN (12 PREGUNTAS)
        function renderUbicacion() {
            respondido = false;
            const card = document.getElementById('app-card');
            const todos = [...baseAnatomica.cara, ...baseAnatomica.corporal];
            const item = todos[iUbi % todos.length];

            let html = `
                <div class="card-header-title">🎯 Desafío Ubicación (${iUbi + 1} de ${todos.length})</div>
                <div class="card-desc">Observa el diagrama neón y selecciona el músculo resaltado:</div>

                <div class="graphic-container">${item.svg}</div>

                <button class="btn-opt" onclick="evaluarUbi('${item.nombre}', '${item.nombre}', this)">${item.nombre}</button>
                <button class="btn-opt" onclick="evaluarUbi('Incorrecto1', '${item.nombre}', this)">Deltoides</button>
                <button class="btn-opt" onclick="evaluarUbi('Incorrecto2', '${item.nombre}', this)">Trapecio</button>

                <div id="fb-ubi" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-ub" style="display:none;" onclick="iUbi++; renderUbicacion();">Siguiente Ubicación ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarUbi(elegido, correcto, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-ubi');

            if(elegido === correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = `<span style='color:var(--neon-green); font-weight:bold;'>¡Correcto!</span> Corresponde a ${correcto}.`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--neon-pink); font-weight:bold;'>Incorrecto.</span> Era ${correcto}.`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-ub').style.display = 'block';
        }

        // MODO 4: FLASHCARDS (12 PREGUNTAS)
        function renderFlashcards() {
            respondido = false;
            const card = document.getElementById('app-card');
            const todos = [...baseAnatomica.cara, ...baseAnatomica.corporal];
            const item = todos[iFlash % todos.length];

            let html = `
                <div class="card-header-title">🎴 Flashcards (${iFlash + 1} de ${todos.length})</div>
                <div class="card-desc">Identifica la tarjeta técnica anatómica:</div>

                <div class="flashcard-box">${item.svg}</div>

                <button class="btn-opt" onclick="evaluarFlash('${item.nombre}', '${item.nombre}', this)">${item.nombre}</button>
                <button class="btn-opt" onclick="evaluarFlash('Glúteo Mayor', '${item.nombre}', this)">Glúteo Mayor</button>
                <button class="btn-opt" onclick="evaluarFlash('Cuádriceps', '${item.nombre}', this)">Cuádriceps Femoral</button>

                <div id="fb-flash" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-fl" style="display:none;" onclick="iFlash++; renderFlashcards();">Siguiente Flashcard ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarFlash(elegido, correcto, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-flash');

            if(elegido === correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = `<span style='color:var(--neon-green); font-weight:bold;'>¡Acertaste!</span>`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--neon-pink); font-weight:bold;'>Incorrecto.</span> Era ${correcto}.`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-fl').style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarBarra();
            renderExplorador();
        });
    </script>
</body>
</html>
