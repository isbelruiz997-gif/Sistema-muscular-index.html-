<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoMaster Pro - Sistema Muscular</title>
    <style>
        :root {
            --primary: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.6);
            --secondary: #00f0ff;
            --accent: #7000ff;
            --correct: #00ff87;
            --wrong: #ff0055;
            --gold: #ffb700;
            --card-bg: rgba(18, 12, 38, 0.88);
            --border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(-45deg, #090514, #1a0b2e, #2b0036, #05192e);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .dash-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 6, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 24px;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.3);
        }

        .dash-item { font-size: 14px; font-weight: 800; }
        .fire-streak { color: var(--gold); text-shadow: 0 0 12px var(--gold); }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }

        .mode-badge {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: 1.2px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff75c3, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ILUSTRACIONES ANATÓMICAS ANATÓMICAMENTE RECONOCIBLES */
        .svg-box {
            width: 100%;
            height: 180px;
            background: rgba(5, 2, 15, 0.85);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
        }

        .study-box {
            background: rgba(10, 6, 26, 0.8);
            border: 1px solid var(--border);
            border-left: 4px solid var(--secondary);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .study-title { font-weight: 800; color: #ff75c3; font-size: 16px; margin-bottom: 8px; }
        .study-detail { font-size: 13px; line-height: 1.5; margin-bottom: 6px; color: var(--text-sub); }
        .study-label { font-weight: 700; color: var(--secondary); }

        .btn-grid { display: flex; flex-direction: column; gap: 12px; }

        .btn-opt {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 16px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 600;
        }

        .btn-opt.correct {
            background: linear-gradient(90deg, #00b09b, #96c93d) !important;
            border-color: var(--correct) !important;
            color: #000;
            font-weight: 800;
        }

        .btn-opt.wrong {
            background: linear-gradient(90deg, #ff0055, #ff5252) !important;
            border-color: #ff5252 !important;
            color: white;
        }

        .input-text {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--secondary);
            background: rgba(5, 2, 15, 0.9);
            color: white;
            font-size: 15px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-action {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .btn-menu {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--secondary);
            color: white;
            padding: 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-menu:active { transform: scale(0.97); background: rgba(0, 240, 255, 0.2); }

        .recovery-banner {
            background: linear-gradient(90deg, #00b09b, #96c93d);
            color: #000;
            padding: 10px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dashboard Gamificado -->
        <div class="dash-bar" id="dash-bar" style="display:none;">
            <div class="dash-item" id="lives-disp">❤️ ❤️ ❤️</div>
            <div class="dash-item fire-streak">🔥 Racha: <span id="streak-disp">0</span></div>
            <div class="dash-item" style="color: var(--secondary);">⭐ <span id="score-disp">0</span> pts</div>
        </div>

        <div class="recovery-banner" id="rec-banner">
            🎉 ¡Racha de 3 aciertos! ¡Recuperaste 1 Vida extra! ❤️
        </div>

        <!-- Tarjeta Principal -->
        <div class="card" id="main-card"></div>
    </div>

    <script>
        // --- SINTETIZADOR DE AUDIO MÁS ALEGRE Y TRIUNFAL ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (type === 'correct') {
                // Arpegio alegre tipo "Fanfarria de Victoria" (Do - Mi - Sol - Do alto)
                const notas = [523.25, 659.25, 783.99, 1046.50];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.08));
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (idx * 0.08));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.08) + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.08));
                    osc.stop(audioCtx.currentTime + (idx * 0.08) + 0.25);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'powerup') {
                const notas = [440, 554.37, 659.25, 880];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.06) + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.06));
                    osc.stop(audioCtx.currentTime + (idx * 0.06) + 0.2);
                });
            }
        }

        // --- BANCO DE DATOS PROFUNDO DIVIDIDO POR REGIONES ---
        const bancoRegiones = {
            facial: {
                nombre: "Anatomía Facial & Masticación",
                leccion: [
                    {
                        nombre: "Masetero & Temporal",
                        ubicacion: "Masetero en la rama mandibular; Temporal en la fosa temporal lateral del cráneo.",
                        funcion: "Potentes elevadores mandibulares responsables del cierre bucal y masticación.",
                        palpacion: "Aprieta las muelas firmemente: sentirás ambos músculos abultarse.",
                        estetica: "Músculos clave en cuadros de bruxismo y tensión mandibular."
                    },
                    {
                        nombre: "Cigomático Mayor & Risorio",
                        ubicacion: "Desde el hueso cigomático (pómulo) y fascia parotídea hasta la comisura labial.",
                        funcion: "Traccionan la comisura labial hacia arriba y afuera (sonrisa y risa).",
                        palpacion: "Sonríe exageradamente marcando las mejillas.",
                        estetica: "Definición del óvalo facial y tono de las mejillas."
                    },
                    {
                        nombre: "Orbicular de los Ojos & Corrugador",
                        ubicacion: "Orbicular rodea la órbita ocular; Corrugador en la zona medial del arco superciliar.",
                        funcion: "Cierre palpebral (parpadeo) y fruncido del entrecejo.",
                        palpacion: "Cierra fuertemente los ojos o frunce el ceño.",
                        estetica: "Tratamiento de 'patas de gallo' y líneas del entrecejo con toxina botulínica."
                    },
                    {
                        nombre: "Bucinador & Orbicular de los Labios",
                        ubicacion: "Bucinador en la pared profunda del cachete; Orbicular rodea la boca.",
                        funcion: "Comprime las mejillas al soplar/masticar y proyecta/cierra los labios.",
                        palpacion: "Infla las mejillas con aire o proyecta los labios para silbar.",
                        estetica: "Sostén de las mejillas y tratamiento de líneas peribucales."
                    }
                ],
                preguntas: [
                    {
                        tipo: "imagen",
                        svg: `<svg width="150" height="150" viewBox="0 0 100 100">
                            <!-- Silueta Cara -->
                            <path d="M 30 20 Q 50 10 70 20 Q 75 50 68 75 Q 50 92 32 75 Q 25 50 30 20 Z" stroke="#ffffff" stroke-width="2" fill="none"/>
                            <!-- Ojos y Boca -->
                            <circle cx="42" cy="40" r="3" fill="#ffffff"/>
                            <circle cx="58" cy="40" r="3" fill="#ffffff"/>
                            <path d="M 44 68 Q 50 72 56 68" stroke="#ffffff" stroke-width="2"/>
                            <!-- Resalte Masetero -->
                            <rect x="58" y="52" width="12" height="20" fill="#00f0ff" rx="3" stroke="#ff007f" stroke-width="1.5"/>
                            <circle cx="64" cy="62" r="2" fill="#ff007f"/>
                        </svg>`,
                        pregunta: "Observa la silueta facial: ¿Qué músculo resaltado en azul en la parte lateral e inferior de la cara eleva la mandíbula al masticar?",
                        opciones: ["Frontal", "Masetero", "Orbicular de los ojos", "Risorio"],
                        correcta: 1,
                        explicacion: "El Masetero se ubica en el lateral posterior mandibular y ejerce la fuerza de oclusión."
                    },
                    {
                        tipo: "imagen",
                        svg: `<svg width="150" height="150" viewBox="0 0 100 100">
                            <path d="M 30 20 Q 50 10 70 20 Q 75 50 68 75 Q 50 92 32 75 Q 25 50 30 20 Z" stroke="#ffffff" stroke-width="2" fill="none"/>
                            <!-- Cejas y Corrugador Resaltado -->
                            <path d="M 36 32 Q 44 32 46 35" stroke="#ff007f" stroke-width="4" fill="none"/>
                            <path d="M 64 32 Q 56 32 54 35" stroke="#ff007f" stroke-width="4" fill="none"/>
                            <circle cx="50" cy="35" r="3" fill="#00f0ff"/>
                        </svg>`,
                        pregunta: "Observa el resalte rosado en el entrecejo: ¿Qué músculo frunce el ceño hacia adentro generando líneas verticales?",
                        opciones: ["Corrugador del supercilio", "Cigomático mayor", "Bucinador", "Temporal"],
                        correcta: 0,
                        explicacion: "El Corrugador atrae la ceja hacia la línea media."
                    },
                    {
                        tipo: "desarrollo",
                        pregunta: "¿Qué músculo principal eleva la comisura labial hacia arriba y afuera para formar la sonrisa?",
                        pista: "Proviene del hueso pómulo (Cigomático...).",
                        respuestaCorrecta: "cigomatico",
                        explicacion: "El Cigomático Mayor eleva la esquina de la boca al sonreír."
                    },
                    {
                        tipo: "opciones",
                        pregunta: "Al inflar los cachetes con aire o sujetar el alimento contra las muelas, ¿qué músculo profundo de la mejilla actúa?",
                        opciones: ["Bucinador", "Masetero", "Frontal", "Platisma"],
                        correcta: 0,
                        explicacion: "El Bucinador comprime la mejilla y ayuda en la masticación y soplado."
                    }
                ]
            },
            corporal: {
                nombre: "Anatomía Corporal & Extremidades",
                leccion: [
                    {
                        nombre: "Esternocleidomastoideo (ECOM) & Platisma",
                        ubicacion: "ECOM en la zona anterolateral del cuello; Platisma subcutáneo desde el tórax hasta la mandíbula.",
                        funcion: "Rotación/flexión de cabeza (ECOM) y tensión de la piel del cuello/escote (Platisma).",
                        palpacion: "Gira la cabeza lateralmente (ECOM) o tensa el cuello enseñando los dientes inferiores (Platisma).",
                        estetica: "Flacidez del cuello (bandas platismales) y drenaje linfático cervical."
                    },
                    {
                        nombre: "Deltoides & Pectoral Mayor",
                        ubicacion: "Deltoides en la cúpula del hombro; Pectoral mayor en la pared anterior del tórax.",
                        funcion: "Elevación lateral del brazo (Deltoides) y aducción/rotación interna del brazo (Pectoral).",
                        palpacion: "Levanta el brazo a 90° o empuja las palmas de las manos una contra otra.",
                        estetica: "Firmeza del busto, escote y tonificación de hombros."
                    },
                    {
                        nombre: "Recto Abdominal & Transverso",
                        ubicacion: "Recto en la pared anterior del abdomen; Transverso en la capa abdominal profunda.",
                        funcion: "Flexión del tronco (Recto) y compresión visceral/faja natural (Transverso).",
                        palpacion: "Realiza un abdominal o mete el ombligo firmemente hacia adentro.",
                        estetica: "Moldeo de la cintura, diástasis abdominal y definición."
                    },
                    {
                        nombre: "Trapecio & Glúteo Mayor",
                        ubicacion: "Trapecio en la espalda superior y cuello posterior; Glúteo mayor en la región posterior de la pelvis.",
                        funcion: "Elevación/retracción escapular (Trapecio) y extensión/rotación de cadera (Glúteo mayor).",
                        palpacion: "Lleva los hombros hacia atrás o extiende la pierna hacia atrás.",
                        estetica: "Alivio descontracturante de hombros y tonificación/levantamiento glúteo."
                    }
                ],
                preguntas: [
                    {
                        tipo: "imagen",
                        svg: `<svg width="150" height="150" viewBox="0 0 100 100">
                            <!-- Silueta Torso y Cuello -->
                            <path d="M 40 20 L 40 30 L 25 40 L 25 80 L 75 80 L 75 40 L 60 30 L 60 20 Z" stroke="#ffffff" stroke-width="2" fill="none"/>
                            <!-- Banda ECOM Resaltada -->
                            <line x1="42" y1="22" x2="56" y2="35" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
                        </svg>`,
                        pregunta: "Observa la silueta del cuello: ¿Qué músculo en banda diagonal resaltado en azul gira la cabeza hacia el lado opuesto?",
                        opciones: ["Esternocleidomastoideo", "Trapecio", "Deltoides", "Pectoral"],
                        correcta: 0,
                        explicacion: "El Esternocleidomastoideo (ECOM) realiza la rotación e inclinación cervical."
                    },
                    {
                        tipo: "imagen",
                        svg: `<svg width="150" height="150" viewBox="0 0 100 100">
                            <path d="M 40 20 L 40 30 L 20 42 L 20 85 L 80 85 L 80 42 L 60 30 L 60 20 Z" stroke="#ffffff" stroke-width="2" fill="none"/>
                            <!-- Resalte Deltoides -->
                            <path d="M 20 42 C 20 35 30 32 35 34 L 28 55 Z" fill="#ff007f" stroke="#00f0ff" stroke-width="1.5"/>
                        </svg>`,
                        pregunta: "Observa el hombro resaltado: ¿Qué músculo abduce (eleva lateralmente) el brazo a 90°?",
                        opciones: ["Bíceps", "Deltoides", "Dorsal ancho", "Glúteo mayor"],
                        correcta: 1,
                        explicacion: "El Deltoides recubre la articulación del hombro y realiza la abducción."
                    },
                    {
                        tipo: "desarrollo",
                        pregunta: "Escribe el nombre del músculo abdominal profundo que actúa como 'faja anatómica' metiendo el ombligo hacia adentro:",
                        pista: "Músculo... del abdomen.",
                        respuestaCorrecta: "transverso",
                        explicacion: "El Transverso del Abdomen comprime las vísceras y estabiliza la zona lumbar."
                    },
                    {
                        tipo: "opciones",
                        pregunta: "Al ponerse de pie desde una silla o subir escalones, ¿qué potente músculo extensor de la cadera se activa principalmente?",
                        opciones: ["Glúteo Mayor", "Cuádriceps", "Trapecio", "Platisma"],
                        correcta: 0,
                        explicacion: "El Glúteo Mayor es el extensor más potente de la cadera."
                    }
                ]
            }
        };

        let regClave = 'facial';
        let iPregunta = 0;
        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let respondido = false;

        function mostrarMenu() {
            document.getElementById('dash-bar').style.display = 'none';
            document.getElementById('main-card').innerHTML = `
                <div class="mode-badge">🧠 AnatomiQuiz Muscular</div>
                <h2>Selecciona la Región de Estudio</h2>
                <p style="font-size:13px; color:var(--text-sub); margin-bottom:20px;">Elige qué área del cuerpo deseas repasar e interactuar:</p>
                
                <div style="display:flex; flex-direction:column; gap:14px;">
                    <button class="btn-menu" onclick="seleccionarRegion('facial')">
                        <span>👤 Módulo Facial & Masticación</span>
                        <span style="color:var(--secondary);">➔</span>
                    </button>

                    <button class="btn-menu" onclick="seleccionarRegion('corporal')">
                        <span>💪 Módulo Corporal & Extremidades</span>
                        <span style="color:var(--secondary);">➔</span>
                    </button>
                </div>
            `;
        }

        function seleccionarRegion(clave) {
            regClave = clave;
            iPregunta = 0;
            puntos = 0;
            racha = 0;
            vidas = 3;
            document.getElementById('dash-bar').style.display = 'flex';
            mostrarLeccion();
        }

        function actualizarDash() {
            document.getElementById('score-disp').innerText = puntos;
            document.getElementById('streak-disp').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-disp').innerText = h;
        }

        function mostrarLeccion() {
            const mod = bancoRegiones[regClave];
            let html = `
                <div class="mode-badge">📖 Módulo de Estudio Extenso</div>
                <h2>${mod.nombre}</h2>
                <p style="font-size:13px; color:var(--text-sub); margin-bottom:15px;">Estudia cada ficha técnica antes de empezar los desafíos:</p>
            `;

            mod.leccion.forEach(m => {
                html += `
                    <div class="study-box">
                        <div class="study-title">⚡ ${m.nombre}</div>
                        <div class="study-detail"><span class="study-label">📍 Ubicación:</span> ${m.ubicacion}</div>
                        <div class="study-detail"><span class="study-label">⚙️ Función:</span> ${m.funcion}</div>
                        <div class="study-detail"><span class="study-label">🤚 Palpación:</span> ${m.palpacion}</div>
                        <div class="study-detail"><span class="study-label">✨ Relevancia Estética/Salud:</span> ${m.estetica}</div>
                    </div>
                `;
            });

            html += `<button class="btn-action" onclick="iniciarQuiz()">¡Iniciar Desafíos Prácticos! 🎯</button>`;
            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function iniciarQuiz() {
            iPregunta = 0;
            cargarPregunta();
        }

        function cargarPregunta() {
            respondido = false;
            const q = bancoRegiones[regClave].preguntas[iPregunta];

            let html = `<div class="mode-badge">🎯 Desafío Interactivo</div>`;

            if (q.tipo === 'imagen') {
                html += `<div class="svg-box">${q.svg}</div>`;
            }

            html += `<div style="font-size:16px; font-weight:600; margin-bottom:16px; line-height:1.45;">${q.pregunta}</div>`;

            if (q.tipo === 'desarrollo') {
                if(q.pista) html += `<div style="font-size:12px; color:var(--secondary); margin-bottom:8px;">💡 Pista: ${q.pista}</div>`;
                html += `<input type="text" id="user-input" class="input-text" placeholder="Escribe tu respuesta aquí...">`;
                html += `<button class="btn-action" onclick="evaluarDesarrollo()">Comprobar Respuesta ✔️</button>`;
            } else {
                html += `<div class="btn-grid">`;
                q.opciones.forEach((op, idx) => {
                    html += `<button class="btn-opt" onclick="evaluarOpcion(${idx}, this)">${String.fromCharCode(65+idx)}) ${op}</button>`;
                });
                html += `</div>`;
            }

            html += `<div id="feedback" style="margin-top:15px; font-size:13px; display:none; background:rgba(5,2,15,0.85); padding:14px; border-radius:12px; border:1px solid var(--border);"></div>`;
            html += `<button class="btn-action" id="btn-next" style="display:none;" onclick="siguiente()">Siguiente ➔</button>`;

            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function procesarResultado(esCorrecto, explicacion) {
            const fb = document.getElementById('feedback');
            if (esCorrecto) {
                playSound('correct');
                racha++;
                puntos += 100 + (racha * 20);

                if (racha % 3 === 0 && vidas < 3) {
                    vidas++;
                    playSound('powerup');
                    const banner = document.getElementById('rec-banner');
                    banner.style.display = 'block';
                    setTimeout(() => banner.style.display = 'none', 3000);
                }
                fb.innerHTML = `<span style="color:var(--correct); font-weight:800;">¡EXCELENTE! 🎉</span><br>${explicacion}`;
            } else {
                playSound('wrong');
                racha = 0;
                vidas--;
                fb.innerHTML = `<span style="color:var(--wrong); font-weight:800;">INCORRECTO ❌</span><br>${explicacion}`;
            }

            fb.style.display = 'block';
            actualizarDash();

            if (vidas > 0) {
                document.getElementById('btn-next').style.display = 'block';
            } else {
                setTimeout(gameOver, 1200);
            }
        }

        function evaluarOpcion(idxOpt, btn) {
            if (respondido) return;
            respondido = true;
            const q = bancoRegiones[regClave].preguntas[iPregunta];
            const btns = document.querySelectorAll('.btn-opt');

            if (idxOpt === q.correcta) {
                btn.classList.add('correct');
                procesarResultado(true, q.explicacion);
            } else {
                btn.classList.add('wrong');
                btns[q.correcta].classList.add('correct');
                procesarResultado(false, q.explicacion);
            }
        }

        function evaluarDesarrollo() {
            if (respondido) return;
            respondido = true;

            const q = bancoRegiones[regClave].preguntas[iPregunta];
            const val = document.getElementById('user-input').value.trim().toLowerCase();

            if (val.includes(q.respuestaCorrecta)) {
                procesarResultado(true, q.explicacion);
            } else {
                procesarResultado(false, `La respuesta correcta era: <strong>${q.respuestaCorrecta}</strong>.<br>${q.explicacion}`);
            }
        }

        function siguiente() {
            iPregunta++;
            if (iPregunta < bancoRegiones[regClave].preguntas.length) {
                cargarPregunta();
            } else {
                victoria();
            }
        }

        function gameOver() {
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--wrong);">💔 ¡SIN VIDAS DISPONIBLES!</h2>
                    <p style="font-size:15px;">Puntaje acumulado: <strong>${puntos} pts</strong></p>
                    <button class="btn-action" onclick="mostrarMenu()">Volver al Menú Principal 🏠</button>
                </div>
            `;
        }

        function victoria() {
            playSound('powerup');
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--correct);">🏆 ¡MÓDULO COMPLETADO!</h2>
                    <p style="font-size:16px;">Puntaje Final: <strong>${puntos} pts</strong></p>
                    <p style="font-size:13px; color:#e0f7fa;">Has demostrado un excelente dominio anatómico de esta región.</p>
                    <button class="btn-action" onclick="mostrarMenu()">Volver al Menú Principal 🏠</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', mostrarMenu);
    </script>
</body>
</html>
