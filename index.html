<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoCosmiatría ESTÉTICA PRO</title>
    <style>
        :root {
            --bg-dark: #070a14;
            --card-bg: #0f1629;
            --primary-pink: #e11d48;
            --primary-pink-hover: #be123c;
            --accent-cyan: #38bdf8;
            --accent-purple: #818cf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
            --correct: #10b981;
            --wrong: #ef4444;
            --gold: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .app-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 800;
            color: #fb7185;
            margin: 0;
        }

        .badge-pro {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid #059669;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .app-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            margin: 4px 0 10px 0;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1322;
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .btn-music {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stats-bar {
            display: flex;
            gap: 12px;
        }

        .stat-badge {
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-tabs-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }

        .nav-tabs-scroll::-webkit-scrollbar { display: none; }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--primary-pink);
            color: white;
            border-color: #f43f5e;
            box-shadow: 0 0 12px rgba(225, 29, 72, 0.4);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .card-header-title {
            font-size: 18px;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 15px;
            line-height: 1.45;
        }

        .region-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn-region {
            background-color: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-region.active {
            background-color: #831843;
            border-color: #f43f5e;
            color: #fbcfe8;
        }

        .graphic-container {
            width: 100%;
            height: 220px;
            background: #070d19;
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .info-panel {
            background-color: #0b1120;
            border-left: 4px solid var(--accent-cyan);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.45;
        }

        .info-title {
            font-weight: 800;
            color: #38bdf8;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .badge-cosmiatria {
            background-color: rgba(225, 29, 72, 0.15);
            border: 1px solid var(--primary-pink);
            color: #fda4af;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 12px;
        }

        .btn-opt {
            background-color: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .btn-opt.correct { background-color: var(--correct) !important; color: white; }
        .btn-opt.wrong { background-color: var(--wrong) !important; color: white; }

        .btn-next {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            margin-top: 12px;
            cursor: pointer;
        }

        .flashcard-box {
            background-color: #1a2336;
            border: 2px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="app-title-container">
                <h1 class="app-title">AnatoCosmiatría</h1>
                <span class="badge-pro">ESTÉTICA PRO</span>
            </div>
            <p class="app-subtitle">Anatomía Muscular para Cosmetología, Cosmiatría y Estética Corporal</p>

            <div class="controls-bar">
                <button class="btn-music" onclick="toggleMusica()">🎵 Música: <span id="music-state">OFF</span></button>
                <div class="stats-bar">
                    <div class="stat-badge" style="color: var(--gold);">🏆 <span id="score-val">0</span></div>
                    <div class="stat-badge" style="color: #f43f5e;">🔥 <span id="streak-val">0</span></div>
                    <div class="stat-badge" id="lives-val">❤️ ❤️ ❤️</div>
                </div>
            </div>
        </header>

        <div class="nav-tabs-scroll">
            <button class="tab-btn active" id="tab-explorador" onclick="cambiarModo('explorador')">🖐️ Explorador</button>
            <button class="tab-btn" id="tab-trivias" onclick="cambiarModo('trivias')">🎓 Trivias (Extenso)</button>
            <button class="tab-btn" id="tab-ubicacion" onclick="cambiarModo('ubicacion')">🎯 Desafío Ubicación</button>
            <button class="tab-btn" id="tab-flashcards" onclick="cambiarModo('flashcards')">🎴 Flashcards</button>
        </div>

        <div class="card" id="app-card"></div>
    </div>

    <script>
        // SINTETIZADOR Y MÚSICA AMBIENTAL (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMusicPlaying = false;
        let musicTimer = null;

        function toggleMusica() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isMusicPlaying = !isMusicPlaying;
            document.getElementById('music-state').innerText = isMusicPlaying ? 'ON 🎶' : 'OFF';

            if (isMusicPlaying) {
                reproducirLoopMusica();
            } else {
                if (musicTimer) clearInterval(musicTimer);
            }
        }

        function reproducirLoopMusica() {
            const notas = [261.63, 293.66, 329.63, 392.00, 440.00];
            let i = 0;
            musicTimer = setInterval(() => {
                if (!isMusicPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = notas[i % notas.length];
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
                i++;
            }, 500);
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (type === 'correct') {
                const notas = [523.25, 659.25, 783.99, 1046.50];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.07));
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + (idx * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.07) + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.07));
                    osc.stop(audioCtx.currentTime + (idx * 0.07) + 0.2);
                });
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // BANCO EXTENDIDO DE MÚSCULOS Y PREGUNTAS
        const baseAnatomica = {
            cara: [
                {
                    nombre: "Masetero",
                    ubicacion: "Arco cigomático hasta el ángulo mandibular.",
                    accion: "Potente elevador mandibular.",
                    aplicacion: "Hipertrofia por bruxismo; masajes descontracturantes.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><rect x="58" y="50" width="14" height="22" rx="3" fill="#e11d48"/><circle cx="42" cy="38" r="3" fill="#fff"/><circle cx="58" cy="38" r="3" fill="#fff"/></svg>`
                },
                {
                    nombre: "Orbicular de los Ojos",
                    ubicacion: "Alrededor de las órbitas oculares.",
                    accion: "Cierra párpados y parpadeo.",
                    aplicacion: "Patas de gallo, drenaje linfático periocular.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><circle cx="42" cy="38" r="10" stroke="#e11d48" stroke-width="3" fill="none"/><circle cx="58" cy="38" r="10" stroke="#e11d48" stroke-width="3" fill="none"/></svg>`
                },
                {
                    nombre: "Cigomático Mayor",
                    ubicacion: "Hueso pómulo a la comisura labial.",
                    accion: "Eleva la comisura labial (sonrisa).",
                    aplicacion: "Lifting facial y maderoterapia.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M 60 42 L 52 65" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/></svg>`
                },
                {
                    nombre: "Corrugador del Supercilio",
                    ubicacion: "Zona medial del arco superciliar.",
                    accion: "Frunce el ceño hacia adentro.",
                    aplicacion: "Tratamiento de arrugas del entrecejo.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M 38 32 Q 44 32 46 35 M 62 32 Q 56 32 54 35" stroke="#e11d48" stroke-width="4"/></svg>`
                },
                {
                    nombre: "Frontal",
                    ubicacion: "Zona anterior de la frente.",
                    accion: "Eleva las cejas y arruga la frente.",
                    aplicacion: "Líneas de expresión horizontales.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 15 Q 50 8 70 15 Q 75 45 68 75 Q 50 90 32 75 Q 25 45 30 15 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M 35 20 Q 50 18 65 20" stroke="#e11d48" stroke-width="5"/></svg>`
                },
                {
                    nombre: "Esternocleidomastoideo (ECOM)",
                    ubicacion: "Zona anterolateral del cuello.",
                    accion: "Rotación e inclinación cervical.",
                    aplicacion: "Drenaje linfático cervical y masaje.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 15 Q 50 8 70 15 L 65 85 L 35 85 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><line x1="42" y1="55" x2="58" y2="78" stroke="#e11d48" stroke-width="5"/></svg>`
                }
            ],
            torso: [
                {
                    nombre: "Recto Abdominal",
                    ubicacion: "Pared anterior del abdomen.",
                    accion: "Flexión de tronco.",
                    aplicacion: "Electroestimulación (ondas rusas) y diástasis.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 35 15 L 65 15 L 60 85 L 40 85 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><rect x="42" y="30" width="16" height="45" rx="3" fill="#e11d48"/></svg>`
                },
                {
                    nombre: "Deltoides",
                    ubicacion: "Cúpula superior del hombro.",
                    accion: "Abducción del brazo.",
                    aplicacion: "Tonificación y modelado corporal.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 20 L 70 20 L 75 80 L 25 80 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M 22 25 Q 32 15 38 25 L 28 48 Z" fill="#e11d48"/></svg>`
                },
                {
                    nombre: "Pectoral Mayor",
                    ubicacion: "Pared anterior del tórax.",
                    accion: "Aducción de hombro.",
                    aplicacion: "Firmeza del busto y escote.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 20 L 70 20 L 75 80 L 25 80 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M 32 25 Q 50 20 68 25 L 62 45 Q 50 48 38 45 Z" fill="#e11d48"/></svg>`
                },
                {
                    nombre: "Trapecio",
                    ubicacion: "Espalda superior y cuello posterior.",
                    accion: "Elevación escapular.",
                    aplicacion: "Masajes descontracturantes de hombros.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 20 L 70 20 L 75 80 L 25 80 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M 35 22 L 65 22 L 50 50 Z" fill="#e11d48"/></svg>`
                },
                {
                    nombre: "Glúteo Mayor",
                    ubicacion: "Región posterior de la pelvis.",
                    accion: "Extensión de cadera.",
                    aplicacion: "Levantamiento glúteo y vacumterapia.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 30 20 L 70 20 L 75 80 L 25 80 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><circle cx="40" cy="65" r="12" fill="#e11d48"/><circle cx="60" cy="65" r="12" fill="#e11d48"/></svg>`
                },
                {
                    nombre: "Transverso del Abdomen",
                    ubicacion: "Capa profunda del abdomen.",
                    accion: "Compresión visceral y faja natural.",
                    aplicacion: "Gimnasia hipopresiva y cinturón anatómico.",
                    svg: `<svg width="120" height="120" viewBox="0 0 100 100"><path d="M 35 15 L 65 15 L 60 85 L 40 85 Z" stroke="#38bdf8" stroke-width="2" fill="none"/><rect x="38" y="45" width="24" height="15" fill="#e11d48"/></svg>`
                }
            ]
        };

        const triviasBanco = [
            {
                q: "Al realizar un tratamiento de lifting facial para elevar pómulos y definir comisuras labiales, ¿qué músculo estimulas principalmente?",
                opts: ["Cigomático Mayor", "Masetero", "Trapecio"],
                cor: 0,
                exp: "El Cigomático Mayor eleva las comisuras de la boca."
            },
            {
                q: "Para aliviar el dolor por apretar los dientes (bruxismo), ¿sobre qué músculo aplicas masaje descontracturante?",
                opts: ["Masetero", "Orbicular de los Ojos", "Frontal"],
                cor: 0,
                exp: "El Masetero es el elevador mandibular principal."
            },
            {
                q: "¿Qué músculo frunce el entrecejo generando arrugas verticales de molestia?",
                opts: ["Corrugador del Supercilio", "Risorio", "Deltoides"],
                cor: 0,
                exp: "El Corrugador atrae la ceja hacia adentro."
            },
            {
                q: "Al realizar un drenaje linfático en el cuello, ¿qué músculo sirve de guía anterolateral?",
                opts: ["Esternocleidomastoideo (ECOM)", "Recto Abdominal", "Bucinador"],
                cor: 0,
                exp: "El ECOM recorre diagonalmente el cuello."
            },
            {
                q: "¿Qué músculo profundo actúa como 'faja anatómica' estabilizando el abdomen?",
                opts: ["Transverso del Abdomen", "Pectoral Mayor", "Glúteo Mayor"],
                cor: 0,
                exp: "El Transverso comprime la cavidad abdominal."
            },
            {
                q: "Al trabajar tonificación con electroestimulación en el hombro, ¿qué músculo se activa?",
                opts: ["Deltoides", "Temporal", "Orbicular de los Labios"],
                cor: 0,
                exp: "El Deltoides recubre la cúpula del hombro."
            }
        ];

        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let modoActual = 'explorador';
        let subZona = 'cara';
        let iTrivia = 0;
        let iUbi = 0;
        let iFlash = 0;
        let respondido = false;

        function actualizarBarra() {
            document.getElementById('score-val').innerText = puntos;
            document.getElementById('streak-val').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-val').innerText = h;
        }

        function cambiarModo(modo) {
            modoActual = modo;
            respondido = false;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${modo}`).classList.add('active');

            if(modo === 'explorador') renderExplorador();
            if(modo === 'trivias') { iTrivia = 0; renderTrivias(); }
            if(modo === 'ubicacion') { iUbi = 0; renderUbicacion(); }
            if(modo === 'flashcards') { iFlash = 0; renderFlashcards(); }
        }

        // MODO 1: EXPLORADOR
        function renderExplorador() {
            const card = document.getElementById('app-card');
            const lista = baseAnatomica[subZona];

            let html = `
                <div class="card-header-title">🖐️ Explorador Muscular Cosmiátrico</div>
                <div class="card-desc">Selecciona un músculo para revisar su acción y aplicación estética.</div>

                <div class="region-selector">
                    <button class="btn-region ${subZona==='cara'?'active':''}" onclick="subZona='cara'; renderExplorador();">🌸 Cara y Cuello</button>
                    <button class="btn-region ${subZona==='torso'?'active':''}" onclick="subZona='torso'; renderExplorador();">🧍 Abdomen & Torso</button>
                </div>

                <div class="graphic-container">${lista[0].svg}</div>

                <div class="region-selector">
            `;

            lista.forEach((m, idx) => {
                html += `<button class="btn-region" onclick="verDetalleExplorador(${idx})">🔹 ${m.nombre}</button>`;
            });

            html += `</div><div class="info-panel" id="explorador-detail">
                <div class="info-title">${lista[0].nombre}</div>
                <strong>📍 Ubicación:</strong> ${lista[0].ubicacion}<br>
                <strong>⚙️ Acción:</strong> ${lista[0].accion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Cosmiátrica:</strong><br>${lista[0].aplicacion}</div>
            </div>`;

            card.innerHTML = html;
        }

        function verDetalleExplorador(idx) {
            const m = baseAnatomica[subZona][idx];
            document.querySelector('.graphic-container').innerHTML = m.svg;
            document.getElementById('explorador-detail').innerHTML = `
                <div class="info-title">${m.nombre}</div>
                <strong>📍 Ubicación:</strong> ${m.ubicacion}<br>
                <strong>⚙️ Acción:</strong> ${m.accion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Cosmiátrica:</strong><br>${m.aplicacion}</div>
            `;
        }

        // MODO 2: TRIVIAS (SECUENCIA FLUIDA)
        function renderTrivias() {
            respondido = false;
            const card = document.getElementById('app-card');
            const q = triviasBanco[iTrivia % triviasBanco.length];

            let html = `
                <div class="card-header-title">🎓 Trivia (${iTrivia + 1} de ${triviasBanco.length})</div>
                <div class="card-desc">${q.q}</div>
            `;

            q.opts.forEach((op, idx) => {
                html += `<button class="btn-opt" onclick="evaluarTrivia(${idx === q.cor}, this, ${q.cor})">${op}</button>`;
            });

            html += `
                <div id="fb-trivia" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-tr" style="display:none;" onclick="siguienteTrivia()">Siguiente Pregunta ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarTrivia(correcto, btn, corIdx) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-trivia');
            const btns = document.querySelectorAll('.btn-opt');
            const q = triviasBanco[iTrivia % triviasBanco.length];

            if(correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                if (racha % 3 === 0 && vidas < 3) vidas++;
                fb.innerHTML = `<span style='color:var(--correct); font-weight:bold;'>¡Correcto! 🎉</span><br>${q.exp}`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                btns[corIdx].classList.add('correct');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--wrong); font-weight:bold;'>Incorrecto ❌</span><br>${q.exp}`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-tr').style.display = 'block';
        }

        function siguienteTrivia() {
            iTrivia++;
            renderTrivias();
        }

        // MODO 3: DESAFÍO UBICACIÓN
        function renderUbicacion() {
            respondido = false;
            const card = document.getElementById('app-card');
            const todos = [...baseAnatomica.cara, ...baseAnatomica.torso];
            const item = todos[iUbi % todos.length];

            let html = `
                <div class="card-header-title">🎯 Desafío Ubicación (${iUbi + 1} de ${todos.length})</div>
                <div class="card-desc">Observa la zona destacada en rojo y selecciona el músculo correcto:</div>

                <div class="graphic-container">${item.svg}</div>

                <button class="btn-opt" onclick="evaluarUbi('${item.nombre}', '${item.nombre}', this)">${item.nombre}</button>
                <button class="btn-opt" onclick="evaluarUbi('Incorrecto1', '${item.nombre}', this)">Deltoides</button>
                <button class="btn-opt" onclick="evaluarUbi('Incorrecto2', '${item.nombre}', this)">Trapecio</button>

                <div id="fb-ubi" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-ub" style="display:none;" onclick="iUbi++; renderUbicacion();">Siguiente Ubicación ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarUbi(elegido, correcto, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-ubi');

            if(elegido === correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = `<span style='color:var(--correct); font-weight:bold;'>¡Correcto!</span> Corresponde a ${correcto}.`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--wrong); font-weight:bold;'>Incorrecto.</span> Era ${correcto}.`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-ub').style.display = 'block';
        }

        // MODO 4: FLASHCARDS
        function renderFlashcards() {
            respondido = false;
            const card = document.getElementById('app-card');
            const todos = [...baseAnatomica.cara, ...baseAnatomica.torso];
            const item = todos[iFlash % todos.length];

            let html = `
                <div class="card-header-title">🎴 Flashcards (${iFlash + 1} de ${todos.length})</div>
                <div class="card-desc">Identifica la tarjeta técnica anatómica:</div>

                <div class="flashcard-box">${item.svg}</div>

                <button class="btn-opt" onclick="evaluarFlash('${item.nombre}', '${item.nombre}', this)">${item.nombre}</button>
                <button class="btn-opt" onclick="evaluarFlash('Glúteo Mayor', '${item.nombre}', this)">Glúteo Mayor</button>
                <button class="btn-opt" onclick="evaluarFlash('Frontal', '${item.nombre}', this)">Frontal</button>

                <div id="fb-flash" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-fl" style="display:none;" onclick="iFlash++; renderFlashcards();">Siguiente Flashcard ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarFlash(elegido, correcto, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-flash');

            if(elegido === correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = `<span style='color:var(--correct); font-weight:bold;'>¡Acertaste!</span>`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--wrong); font-weight:bold;'>Incorrecto.</span> Era ${correcto}.`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-fl').style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarBarra();
            renderExplorador();
        });
    </script>
</body>
</html>
