<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoMaster Deluxe - Sistema Muscular</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary: #f43f5e;
            --primary-glow: rgba(244, 63, 94, 0.4);
            --accent: #38bdf8;
            --correct: #10b981;
            --wrong: #ef4444;
            --gold: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Dashboard de Vidas y Racha */
        .dash-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .dash-item {
            font-size: 14px;
            font-weight: bold;
        }

        .fire-streak {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        /* Tarjeta Estilizada */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .mode-badge {
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            color: white;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 20px;
            background: linear-gradient(90deg, #f43f5e, #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Ilustración SVG */
        .svg-container {
            width: 100%;
            height: 140px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        /* Fichas de Estudio Detalladas */
        .study-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .study-title {
            font-weight: bold;
            color: #f472b6;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .study-detail {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .study-label {
            font-weight: bold;
            color: var(--accent);
        }

        /* Preguntas & Botones */
        .q-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.45;
        }

        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-opt {
            background: rgba(51, 65, 85, 0.7);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .btn-opt:active {
            transform: scale(0.98);
        }

        .btn-opt.correct {
            background: linear-gradient(90deg, #059669, #10b981) !important;
            border-color: #34d399 !important;
            color: white;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .btn-opt.wrong {
            background: linear-gradient(90deg, #dc2626, #ef4444) !important;
            border-color: #f87171 !important;
            color: white;
        }

        .btn-action {
            background: linear-gradient(90deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .hint-box {
            background: rgba(13, 21, 39, 0.9);
            border-left: 3px solid var(--accent);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 12px;
            display: none;
        }

        .recovery-banner {
            background: linear-gradient(90deg, #059669, #10b981);
            color: white;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            display: none;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dashboard Gamificado -->
        <div class="dash-bar">
            <div class="dash-item" id="lives-disp">❤️ ❤️ ❤️</div>
            <div class="dash-item fire-streak">🔥 Racha: <span id="streak-disp">0</span></div>
            <div class="dash-item" style="color: var(--accent);">⭐ <span id="score-disp">0</span> pts</div>
        </div>

        <div class="recovery-banner" id="rec-banner">
            🎉 ¡Racha de 3 aciertos! ¡Recuperaste 1 Vida extra! ❤️
        </div>

        <!-- Tarjeta Principal -->
        <div class="card" id="main-card"></div>
    </div>

    <script>
        // --- SINTETIZADOR DE AUDIO (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'powerup') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            }
        }

        // --- BANCO DE DATOS EXTENSO ---
        const modulos = [
            {
                zona: "Músculos Faciales y Masticación",
                svg: `<svg width="100" height="100" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="45" r="30" stroke="#f472b6" stroke-width="3"/>
                    <circle cx="40" cy="40" r="4" fill="#38bdf8"/>
                    <circle cx="60" cy="40" r="4" fill="#38bdf8"/>
                    <path d="M 40 60 Q 50 70 60 60" stroke="#f43f5e" stroke-width="3" fill="none"/>
                    <path d="M 30 45 Q 50 25 70 45" stroke="#fb7185" stroke-width="2" fill="none"/>
                </svg>`,
                leccion: [
                    {
                        nombre: "Masetero",
                        ubicacion: "Región lateral de la cara, se extiende desde el arco cigomático (pómulo) hasta el ángulo inferior de la mandíbula.",
                        funcion: "Potente elevador de la mandíbula. Es el músculo principal de la masticación y oclusión dental.",
                        palpacion: "Aprieta las muelas con fuerza y coloca los dedos en la parte posterior del cachete: sentirás una masa rígida abultarse.",
                        estetica: "Hipertrofia por bruxismo. Zona de aplicación de relajantes musculares y masaje descontracturante mandibular."
                    },
                    {
                        nombre: "Orbicular de los Labios",
                        ubicacion: "Espectacular esfínter muscular que rodea completamente la abertura bucal.",
                        funcion: "Cierra, protruye (proyecta hacia adelante) y frunce los labios.",
                        palpacion: "Intenta silbar o mandar un beso al aire; sentirás la tensión en todo el borde labial.",
                        estetica: "Tratamiento de las arrugas peribucales ('código de barras') e hidratación con ácido hialurónico."
                    },
                    {
                        nombre: "Corrugador del Supercilio",
                        ubicacion: "Pequeño músculo profundo ubicado en el extremo interno de cada ceja.",
                        funcion: "Tracciona la ceja hacia abajo y hacia adentro, creando las arrugas verticales de la concentración o el enojo.",
                        palpacion: "Arruga el ceño mostrando molestia y toca justo el inicio interno de la ceja.",
                        estetica: "Zona número uno de aplicación de toxina botulínica (Botox) para suavizar la mirada."
                    }
                ],
                preguntas: [
                    {
                        pregunta: "Si una persona tiene el hábito involuntario de apretar los dientes (bruxismo), ¿qué músculo facial se hipertrofia y genera tensión mandibular?",
                        pista: "Se ubica en los laterales de la cara y eleva la mandíbula al morder.",
                        opciones: ["Orbicular de los labios", "Masetero", "Corrugador", "Frontal"],
                        correcta: 1,
                        explicacion: "El Masetero es el músculo más fuerte de la masticación y se tensiona severamente con el bruxismo."
                    },
                    {
                        pregunta: "¿Qué músculo rodea completamente la boca y nos permite silbar, soplar o proyectar los labios hacia afuera?",
                        pista: "Es un músculo esfínter que rodea la cavidad oral.",
                        opciones: ["Risorio", "Cigomático Mayor", "Orbicular de los Labios", "Temporal"],
                        correcta: 2,
                        explicacion: "El Orbicular de los Labios controla el cierre y la postura de la boca."
                    }
                ]
            },
            {
                zona: "Cuello, Espalda y Brazos",
                svg: `<svg width="100" height="100" viewBox="0 0 100 100" fill="none">
                    <path d="M 30 80 L 35 30 L 50 20 L 65 30 L 70 80" stroke="#38bdf8" stroke-width="3" fill="none"/>
                    <path d="M 20 50 L 35 30 M 80 50 L 65 30" stroke="#f43f5e" stroke-width="3"/>
                </svg>`,
                leccion: [
                    {
                        nombre: "Esternocleidomastoideo (ECOM)",
                        ubicacion: "Se origina en el esternón y la clavícula y se inserta en la apófisis mastoides (detrás de la oreja).",
                        funcion: "Rotación de la cabeza hacia el lado opuesto, inclinación lateral y flexión del cuello.",
                        palpacion: "Gira la cabeza hacia la derecha y toca la parte izquierda de tu cuello: verás una banda gruesa y destacada.",
                        estetica: "Vía principal para el drenaje linfático manual de rostro y cuello."
                    },
                    {
                        nombre: "Deltoides",
                        ubicacion: "Músculo voluminoso en forma de cono que cubre la articulación del hombro.",
                        funcion: "Abducción del brazo (elevar el brazo hacia los lados) y estabilización de la articulación del hombro.",
                        palpacion: "Levanta el brazo en 90 grados hacia un lado y palpa la parte superior del hombro.",
                        estetica: "Moldeo corporal y tonificación muscular mediante electroestimulación."
                    }
                ],
                preguntas: [
                    {
                        pregunta: "Al girar la cabeza firmemente para mirar a un lado, resalta una banda gruesa que va desde la clavícula hasta detrás de la oreja. ¿Cuál es?",
                        pista: "Su nombre combina Sternon, Cleido (clavícula) y Mastoides.",
                        opciones: ["Deltoides", "Esternocleidomastoideo", "Trapecio", "Pectoral"],
                        correcta: 1,
                        explicacion: "El Esternocleidomastoideo (ECOM) es clave para los movimientos de rotación cervical."
                    },
                    {
                        pregunta: "Al levantar el brazo lateralmente alejándolo del cuerpo, ¿qué músculo realiza la fuerza principal en la parte superior del hombro?",
                        pista: "Tiene forma de triángulo y cubre la articulación del hombro.",
                        opciones: ["Deltoides", "Bíceps", "Tríceps", "Platisma"],
                        correcta: 0,
                        explicacion: "El Deltoides es el abductor principal del hombro."
                    }
                ]
            }
        ];

        let iModulo = 0;
        let iPregunta = 0;
        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let respondido = false;

        function actualizarDash() {
            document.getElementById('score-disp').innerText = puntos;
            document.getElementById('streak-disp').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-disp').innerText = h;
        }

        function mostrarLeccion() {
            const mod = modulos[iModulo];
            let htmlLeccion = `
                <div class="mode-badge">📖 Módulo de Estudio Extenso</div>
                <h2>${mod.zona}</h2>
                <div class="svg-container">${mod.svg}</div>
                <p style="font-size:13px; color:var(--text-sub); margin-bottom:15px;">Estudia detalladamente cada ficha antes de iniciar el examen práctico:</p>
            `;

            mod.leccion.forEach(m => {
                htmlLeccion += `
                    <div class="study-box">
                        <div class="study-title">🔹 ${m.nombre}</div>
                        <div class="study-detail"><span class="study-label">📍 Ubicación:</span> ${m.ubicacion}</div>
                        <div class="study-detail"><span class="study-label">⚙️ Función:</span> ${m.funcion}</div>
                        <div class="study-detail"><span class="study-label">🤚 Cómo reconocerlo:</span> ${m.palpacion}</div>
                        <div class="study-detail"><span class="study-label">✨ Aplicación Estética/Salud:</span> ${m.estetica}</div>
                    </div>
                `;
            });

            htmlLeccion += `<button class="btn-action" onclick="iniciarQuiz()">¡Iniciar Desafío Práctico! 🎯</button>`;
            document.getElementById('main-card').innerHTML = htmlLeccion;
            actualizarDash();
        }

        function iniciarQuiz() {
            iPregunta = 0;
            cargarPregunta();
        }

        function cargarPregunta() {
            respondido = false;
            const q = modulos[iModulo].preguntas[iPregunta];

            let html = `
                <div class="mode-badge">🎯 Desafío Interactivo</div>
                <div class="q-text">${q.pregunta}</div>

                <button style="background:rgba(255,255,255,0.05); border:1px dashed var(--accent); color:var(--accent); padding:6px 12px; border-radius:8px; font-size:12px; margin-bottom:12px; cursor:pointer;" onclick="document.getElementById('pista').style.display='block'">💡 Ver Pista Corporal</button>
                <div class="hint-box" id="pista">Pista: ${q.pista}</div>

                <div class="btn-grid">
            `;

            q.opciones.forEach((op, idx) => {
                html += `<button class="btn-opt" onclick="evaluar(${idx}, this)">${String.fromCharCode(65+idx)}) ${op}</button>`;
            });

            html += `</div><div id="feedback" style="margin-top:15px; font-size:13px; display:none; background:rgba(15,23,42,0.8); padding:12px; border-radius:10px;"></div>`;
            html += `<button class="btn-action" id="btn-next" style="display:none;" onclick="siguiente()">Siguiente ➔</button>`;

            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function evaluar(idxOpt, btn) {
            if (respondido) return;
            respondido = true;

            const q = modulos[iModulo].preguntas[iPregunta];
            const fb = document.getElementById('feedback');
            const btns = document.querySelectorAll('.btn-opt');

            if (idxOpt === q.correcta) {
                playSound('correct');
                btn.classList.add('correct');
                racha++;
                puntos += 100 + (racha * 20);

                if (racha % 3 === 0 && vidas < 3) {
                    vidas++;
                    playSound('powerup');
                    const banner = document.getElementById('rec-banner');
                    banner.style.display = 'block';
                    setTimeout(() => banner.style.display = 'none', 3000);
                }
                fb.innerHTML = `<span style="color:var(--correct); font-weight:bold;">¡Correcto! 🎉</span><br>${q.explicacion}`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                btns[q.correcta].classList.add('correct');
                racha = 0;
                vidas--;
                fb.innerHTML = `<span style="color:var(--wrong); font-weight:bold;">Incorrecto ❌</span><br>${q.explicacion}`;
            }

            fb.style.display = 'block';
            actualizarDash();

            if (vidas > 0) {
                document.getElementById('btn-next').style.display = 'block';
            } else {
                setTimeout(gameOver, 1200);
            }
        }

        function siguiente() {
            iPregunta++;
            if (iPregunta < modulos[iModulo].preguntas.length) {
                cargarPregunta();
            } else {
                iModulo++;
                if (iModulo < modulos.length) {
                    mostrarLeccion();
                } else {
                    victoria();
                }
            }
        }

        function gameOver() {
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--wrong);">💔 ¡Te has quedado sin vidas!</h2>
                    <p style="font-size:15px;">Puntaje acumulado: <strong>${puntos} pts</strong></p>
                    <p style="font-size:13px; color:var(--text-sub);">Repasar las fichas de estudio te ayudará a fijar la memoria muscular.</p>
                    <button class="btn-action" onclick="location.reload()">Reintentar Nivel 🔄</button>
                </div>
            `;
        }

        function victoria() {
            playSound('powerup');
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--correct);">🏆 ¡Excelente Trabajo!</h2>
                    <p style="font-size:16px;">Puntaje Final: <strong>${puntos} pts</strong></p>
                    <p style="font-size:13px; color:#a7f3d0;">Completaste los módulos con racha y recuperación de vidas.</p>
                    <button class="btn-action" onclick="location.reload()">Volver a Jugar 🔄</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', mostrarLeccion);
    </script>
</body>
</html>
