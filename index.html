    <script>
        // SINTETIZADOR DE AUDIO Y MÚSICA ANIMADA
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMusicPlaying = false;
        let musicTimer = null;

        function toggleMusica() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isMusicPlaying = !isMusicPlaying;
            document.getElementById('music-state').innerText = isMusicPlaying ? 'ON 🎶' : 'OFF';

            if (isMusicPlaying) {
                reproducirLoopMusicaAnimada();
            } else {
                if (musicTimer) clearInterval(musicTimer);
            }
        }

        function reproducirLoopMusicaAnimada() {
            // Secuencia de bajos y melodía rítmica alegre
            const secuencia = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23];
            let i = 0;
            musicTimer = setInterval(() => {
                if (!isMusicPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = secuencia[i % secuencia.length];
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.28);
                i++;
            }, 300); // Ritmo más rápido y animado
        }

        function lanzarConfeti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff007f', '#00f0ff', '#00ff87', '#ffb700', '#8a2be2']
                });
            }
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (type === 'correct') {
                lanzarConfeti(); // Papelitos volando
                const notas = [523.25, 659.25, 783.99, 1046.50];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.setValueAtTime(0.18, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.06) + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.06));
                    osc.stop(audioCtx.currentTime + (idx * 0.06) + 0.22);
                });
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

            { q: "¿Qué músculo orbicular rodea las órbitas oculares produciendo las patas de gallo?", opts: ["Orbicular de los Ojos", "Corrugador", "Masetero"], cor: 0, exp: "El Orbicular de los Ojos es el esfínter periocular." },
            { q: "Al aplicar electroestimulación en el abdomen para tonificar la línea alba, ¿qué músculo se activa?", opts: ["Recto Abdominal", "Cuádriceps", "ECOM"], cor: 0, exp: "El Recto Abdominal flexiona el tronco y marca la pared anterior." },
            { q: "Para un drenaje linfático de rostro y cuello, ¿qué músculo guía la vía anterolateral?", opts: ["Esternocleidomastoideo (ECOM)", "Glúteo", "Oblicuo"], cor: 0, exp: "El ECOM recorre diagonalmente el cuello sirviendo de guía." },
            { q: "¿Qué músculo del entrecejo junta las cejas generando arrugas verticales de molestia?", opts: ["Corrugador del Supercilio", "Risorio", "Deltoides"], cor: 0, exp: "El Corrugador atrae la ceja hacia la línea media." }
        ];

        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let modoActual = 'explorador';
        let subZona = 'cara';
        let iTrivia = 0;
        let iUbi = 0;
        let iFlash = 0;
        let respondido = false;
        let preguntasFallidas = [];

        function actualizarBarra() {
            document.getElementById('score-val').innerText = puntos;
            document.getElementById('streak-val').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-val').innerText = h;
        }

        function cambiarModo(modo) {
            modoActual = modo;
            respondido = false;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${modo}`).classList.add('active');

            if(modo === 'explorador') renderExplorador();
            if(modo === 'trivias') { iTrivia = 0; renderTrivias(); }
            if(modo === 'ubicacion') { iUbi = 0; renderUbicacion(); }
            if(modo === 'flashcards') { iFlash = 0; renderFlashcards(); }
        }

        // MODO 1: EXPLORADOR DIDÁCTICO
        function renderExplorador() {
            const card = document.getElementById('app-card');
            const lista = baseAnatomica[subZona];

            let html = `
                <div class="card-header-title">📖 Manual Didáctico de Anatomía</div>
                <div class="card-desc">Selecciona una zona y explora paso a paso cómo reconocer cada músculo y su aplicación en estética:</div>

                <div class="region-selector">
                    <button class="btn-region ${subZona==='cara'?'active':''}" onclick="subZona='cara'; renderExplorador();">🌸 Cara y Cuello</button>
                    <button class="btn-region ${subZona==='corporal'?'active':''}" onclick="subZona='corporal'; renderExplorador();">🦵 Abdomen, Glúteos y Piernas</button>
                </div>

                <div class="graphic-container">${lista[0].svg}</div>

                <div class="region-selector">
            `;

            lista.forEach((m, idx) => {
                html += `<button class="btn-region" onclick="verDetalleExplorador(${idx})">🔹 ${m.nombre.split(' ')[0]}</button>`;
            });

            html += `</div><div class="info-panel" id="explorador-detail">
                <div class="info-title">${lista[0].nombre}</div>
                <strong>📍 Ubicación Anatómica:</strong> ${lista[0].ubicacion}<br>
                <strong>⚙️ Biomecánica:</strong> ${lista[0].accion}<br>
                <strong>🤚 Palpación Corporal:</strong> ${lista[0].palpacion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Estética / Reductora:</strong><br>${lista[0].aplicacion}</div>
            </div>`;

            card.innerHTML = html;
        }

        function verDetalleExplorador(idx) {
            const m = baseAnatomica[subZona][idx];
            document.querySelector('.graphic-container').innerHTML = m.svg;
            document.getElementById('explorador-detail').innerHTML = `
                <div class="info-title">${m.nombre}</div>
                <strong>📍 Ubicación Anatómica:</strong> ${m.ubicacion}<br>
                <strong>⚙️ Biomecánica:</strong> ${m.accion}<br>
                <strong>🤚 Palpación Corporal:</strong> ${m.palpacion}
                <div class="badge-cosmiatria">✨ <strong>Aplicación Estética / Reductora:</strong><br>${m.aplicacion}</div>
            `;
        }

        // MODO 2: TRIVIAS DIDÁCTICAS CON CONFETI Y RECUPERACIÓN
        function renderTrivias() {
            respondido = false;
            const card = document.getElementById('app-card');
            const q = triviasBanco[iTrivia % triviasBanco.length];

            let html = `
                <div class="card-header-title">🎓 Trivia Didáctica (${iTrivia + 1} de ${triviasBanco.length})</div>
                <div class="card-desc">${q.q}</div>
            `;

            q.opts.forEach((op, idx) => {
                html += `<button class="btn-opt" onclick="evaluarTrivia(${idx === q.cor}, this, ${q.cor})">${op}</button>`;
            });

            html += `
                <div id="fb-trivia" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-tr" style="display:none;" onclick="siguienteTrivia()">Siguiente Pregunta ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarTrivia(correcto, btn, corIdx) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-trivia');
            const btns = document.querySelectorAll('.btn-opt');
            const q = triviasBanco[iTrivia % triviasBanco.length];

            if(correcto) {
                playSound('correct'); // Lanza confeti + sonido alegre
                btn.classList.add('correct');
                puntos += 100; racha++;
                if (racha % 3 === 0 && vidas < 3) vidas++;
                fb.innerHTML = `<span style='color:var(--neon-green); font-weight:bold;'>¡EXCELENTE! 🎉</span><br>${q.exp}`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                btns[corIdx].classList.add('correct');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--neon-pink); font-weight:bold;'>Incorrecto ❌</span><br>${q.exp}`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-tr').style.display = 'block';
        }

        function siguienteTrivia() {
            iTrivia++;
            renderTrivias();
        }

        // MODO 3: DESAFÍO UBICACIÓN
        function renderUbicacion() {
            respondido = false;
            const card = document.getElementById('app-card');
            const todos = [...baseAnatomica.cara, ...baseAnatomica.corporal];
            const item = todos[iUbi % todos.length];

            let html = `
                <div class="card-header-title">🎯 Desafío Ubicación (${iUbi + 1} de ${todos.length})</div>
                <div class="card-desc">Observa el esquema anatómico y reconoce el músculo destacado en rosa:</div>

                <div class="graphic-container">${item.svg}</div>

                <button class="btn-opt" onclick="evaluarUbi('${item.nombre}', '${item.nombre}', this)">${item.nombre}</button>
                <button class="btn-opt" onclick="evaluarUbi('Incorrecto1', '${item.nombre}', this)">Músculo Genérico A</button>
                <button class="btn-opt" onclick="evaluarUbi('Incorrecto2', '${item.nombre}', this)">Músculo Genérico B</button>

                <div id="fb-ubi" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-ub" style="display:none;" onclick="iUbi++; renderUbicacion();">Siguiente Ubicación ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarUbi(elegido, correcto, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-ubi');

            if(elegido === correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = `<span style='color:var(--neon-green); font-weight:bold;'>¡Correcto!</span> Corresponde a ${correcto}.`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--neon-pink); font-weight:bold;'>Incorrecto.</span> Era ${correcto}.`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-ub').style.display = 'block';
        }

        // MODO 4: FLASHCARDS
        function renderFlashcards() {
            respondido = false;
            const card = document.getElementById('app-card');
            const todos = [...baseAnatomica.cara, ...baseAnatomica.corporal];
            const item = todos[iFlash % todos.length];

            let html = `
                <div class="card-header-title">🎴 Flashcards Didácticas (${iFlash + 1} de ${todos.length})</div>
                <div class="card-desc">Observa la tarjeta técnica e identifica la anatomía:</div>

                <div class="flashcard-box">${item.svg}</div>

                <button class="btn-opt" onclick="evaluarFlash('${item.nombre}', '${item.nombre}', this)">${item.nombre}</button>
                <button class="btn-opt" onclick="evaluarFlash('Glúteo Mayor', '${item.nombre}', this)">Glúteo Mayor</button>
                <button class="btn-opt" onclick="evaluarFlash('Cuádriceps', '${item.nombre}', this)">Cuádriceps Femoral</button>

                <div id="fb-flash" style="margin-top:10px; font-size:13px; display:none;"></div>
                <button class="btn-next" id="btn-next-fl" style="display:none;" onclick="iFlash++; renderFlashcards();">Siguiente Flashcard ➔</button>
            `;

            card.innerHTML = html;
        }

        function evaluarFlash(elegido, correcto, btn) {
            if(respondido) return;
            respondido = true;
            const fb = document.getElementById('fb-flash');

            if(elegido === correcto) {
                playSound('correct');
                btn.classList.add('correct');
                puntos += 100; racha++;
                fb.innerHTML = `<span style='color:var(--neon-green); font-weight:bold;'>¡Acertaste la tarjeta! 🎉</span>`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                racha = 0; vidas--;
                fb.innerHTML = `<span style='color:var(--neon-pink); font-weight:bold;'>Incorrecto.</span> Era ${correcto}.`;
            }
            actualizarBarra();
            fb.style.display = 'block';
            document.getElementById('btn-next-fl').style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarBarra();
            renderExplorador();
        });
    </script>
</body>
</html>
