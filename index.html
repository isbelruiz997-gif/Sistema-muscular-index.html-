<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoMaster Pro</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #f43f5e;
            --accent: #38bdf8;
            --correct: #10b981;
            --wrong: #ef4444;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .dash-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h2 {
            color: #fb7185;
            margin-top: 0;
            font-size: 20px;
        }

        .btn-menu {
            background-color: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            text-align: left;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-opt {
            background-color: #334155;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            margin-bottom: 8px;
            display: block;
        }

        .btn-opt.correct { background-color: var(--correct) !important; color: white; }
        .btn-opt.wrong { background-color: var(--wrong) !important; color: white; }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 15px;
            cursor: pointer;
        }

        .study-box {
            background-color: #0f172a;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="dash-bar" id="dash-bar" style="display:none;">
            <div id="lives-disp">❤️ ❤️ ❤️</div>
            <div style="color: #ffb703; font-weight:bold;">🔥 Racha: <span id="streak-disp">0</span></div>
            <div style="color: var(--accent); font-weight:bold;">⭐ <span id="score-disp">0</span> pts</div>
        </div>

        <div class="card" id="main-card"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        const datos = {
            facial: {
                titulo: "Músculos Faciales y Masticación",
                leccion: [
                    { nombre: "Masetero", desc: "Lateral de la mandíbula. Eleva la mandíbula con fuerza para masticar." },
                    { nombre: "Orbicular de los Ojos", desc: "Rodea el ojo. Cierra los párpados y protege el globo ocular." },
                    { nombre: "Cigomático Mayor", desc: "Va del pómulo a la comisura. Eleva la boca para sonreír." }
                ],
                preguntas: [
                    {
                        pregunta: "¿Qué músculo es el principal responsable de elevar la mandíbula al masticar?",
                        opciones: ["Frontal", "Masetero", "Risorio", "Platisma"],
                        correcta: 1,
                        exp: "El Masetero es el músculo principal de la masticación."
                    },
                    {
                        pregunta: "¿Qué músculo de la cara se encarga de elevar la comisura labial para sonreír?",
                        opciones: ["Cigomático Mayor", "Orbicular de los ojos", "Temporal", "Bucinador"],
                        correcta: 0,
                        exp: "El Cigomático Mayor tracciona la boca hacia arriba y afuera."
                    }
                ]
            },
            corporal: {
                titulo: "Músculos Corporales y Extremidades",
                leccion: [
                    { nombre: "Deltoides", desc: "Hombro. Eleva el brazo lateralmente (abducción)." },
                    { nombre: "Recto Abdominal", desc: "Pared anterior del abdomen. Flexiona el tronco." },
                    { nombre: "Glúteo Mayor", desc: "Cadera posterior. Extiende la pierna hacia atrás." }
                ],
                preguntas: [
                    {
                        pregunta: "Al levantar el brazo hacia los lados, ¿qué músculo del hombro realiza el movimiento?",
                        opciones: ["Bíceps", "Deltoides", "Trapecio", "Pectoral"],
                        correcta: 1,
                        exp: "El Deltoides es el abductor principal del hombro."
                    },
                    {
                        pregunta: "¿Qué músculo de la espalda alta ayuda a sostener los hombros y mover las escápulas?",
                        opciones: ["Trapecio", "Cuádriceps", "Recto abdominal", "Glúteo"],
                        correcta: 0,
                        exp: "El Trapecio sostiene y moviliza la cintura escapular."
                    }
                ]
            }
        };

        let regActual = 'facial';
        let iPregunta = 0;
        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let respondido = false;

        function mostrarMenu() {
            document.getElementById('dash-bar').style.display = 'none';
            document.getElementById('main-card').innerHTML = `
                <h2>AnatoMaster Pro 🧠</h2>
                <p style="color: var(--subtext); font-size: 13px; margin-bottom: 15px;">Selecciona el módulo de estudio:</p>
                <button class="btn-menu" onclick="elegirRegion('facial')">👤 Módulo Facial & Masticación</button>
                <button class="btn-menu" onclick="elegirRegion('corporal')">💪 Módulo Corporal & Extremidades</button>
            `;
        }

        function elegirRegion(reg) {
            regActual = reg;
            iPregunta = 0;
            puntos = 0;
            racha = 0;
            vidas = 3;
            document.getElementById('dash-bar').style.display = 'flex';
            mostrarLeccion();
        }

        function actualizarDash() {
            document.getElementById('score-disp').innerText = puntos;
            document.getElementById('streak-disp').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-disp').innerText = h;
        }

        function mostrarLeccion() {
            const m = datos[regActual];
            let html = `<h2>📖 Lección: ${m.titulo}</h2>`;
            m.leccion.forEach(l => {
                html += `<div class="study-box"><strong>🔹 ${l.nombre}</strong><br>${l.desc}</div>`;
            });
            html += `<button class="btn-action" onclick="iniciarQuiz()">¡Iniciar Examen! 🎯</button>`;
            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function iniciarQuiz() {
            iPregunta = 0;
            cargarPregunta();
        }

        function cargarPregunta() {
            respondido = false;
            const q = datos[regActual].preguntas[iPregunta];
            let html = `<h2>🎯 Desafío</h2><p style="font-weight:600; font-size:15px; margin-bottom:15px;">${q.pregunta}</p>`;
            
            q.opciones.forEach((op, idx) => {
                html += `<button class="btn-opt" onclick="verificar(${idx}, this)">${String.fromCharCode(65+idx)}) ${op}</button>`;
            });

            html += `<div id="feedback" style="margin-top:12px; font-size:13px; display:none;"></div>`;
            html += `<button class="btn-action" id="btn-next" style="display:none;" onclick="siguiente()">Siguiente ➔</button>`;

            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function verificar(elegida, btn) {
            if (respondido) return;
            respondido = true;
            const q = datos[regActual].preguntas[iPregunta];
            const btns = document.querySelectorAll('.btn-opt');
            const fb = document.getElementById('feedback');

            if (elegida === q.correcta) {
                playSound('correct');
                btn.classList.add('correct');
                racha++;
                puntos += 100;
                fb.innerHTML = `<span style="color:var(--correct); font-weight:bold;">¡Correcto! 🎉</span><br>${q.exp}`;
            } else {
                playSound('wrong');
                btn.classList.add('wrong');
                btns[q.correcta].classList.add('correct');
                racha = 0;
                vidas--;
                fb.innerHTML = `<span style="color:var(--wrong); font-weight:bold;">Incorrecto ❌</span><br>${q.exp}`;
            }

            fb.style.display = 'block';
            actualizarDash();

            if (vidas > 0) {
                document.getElementById('btn-next').style.display = 'block';
            } else {
                setTimeout(() => {
                    document.getElementById('main-card').innerHTML = `
                        <h2>💔 Fin del Juego</h2>
                        <p>Obtuviste <strong>${puntos} puntos</strong>.</p>
                        <button class="btn-action" onclick="mostrarMenu()">Volver al Menú 🏠</button>
                    `;
                }, 1200);
            }
        }

        function siguiente() {
            iPregunta++;
            if (iPregunta < datos[regActual].preguntas.length) {
                cargarPregunta();
            } else {
                document.getElementById('main-card').innerHTML = `
                    <h2>🏆 ¡Módulo Superado!</h2>
                    <p>Puntaje final: <strong>${puntos} pts</strong></p>
                    <button class="btn-action" onclick="mostrarMenu()">Volver al Menú 🏠</button>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', mostrarMenu);
    </script>
</body>
</html>
