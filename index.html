<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoMaster Ultra - Juego Muscular</title>
    <style>
        :root {
            --primary: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.6);
            --secondary: #00f0ff;
            --accent: #7000ff;
            --correct: #00ff87;
            --wrong: #ff0055;
            --gold: #ffb700;
            --card-bg: rgba(18, 12, 38, 0.85);
            --border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(-45deg, #090514, #1a0b2e, #2b0036, #05192e);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* BARRA DASHBOARD DE NEÓN */
        .dash-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 6, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 24px;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.3);
        }

        .dash-item {
            font-size: 14px;
            font-weight: 800;
        }

        .fire-streak {
            color: var(--gold);
            text-shadow: 0 0 12px var(--gold);
        }

        /* TARJETA GLASSMORPHISM */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }

        .mode-badge {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: 1.2px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff75c3, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ILUSTRACIÓN ANATÓMICA SVG CON RESALTE DE MÚSCULO */
        .svg-box {
            width: 100%;
            height: 150px;
            background: rgba(5, 2, 15, 0.7);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .study-box {
            background: rgba(10, 6, 26, 0.75);
            border: 1px solid var(--border);
            border-left: 4px solid var(--secondary);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .study-title {
            font-weight: 800;
            color: #ff75c3;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .study-detail {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .study-label {
            font-weight: 700;
            color: var(--secondary);
        }

        /* BOTONES DE SELECCIÓN Y INPUT DE DESARROLLO */
        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-opt {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 16px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 600;
        }

        .btn-opt:active { transform: scale(0.96); }

        .btn-opt.correct {
            background: linear-gradient(90deg, #00b09b, #96c93d) !important;
            border-color: var(--correct) !important;
            color: #000;
            font-weight: 800;
        }

        .btn-opt.wrong {
            background: linear-gradient(90deg, #ff0055, #ff5252) !important;
            border-color: #ff5252 !important;
            color: white;
        }

        .input-text {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--secondary);
            background: rgba(5, 2, 15, 0.8);
            color: white;
            font-size: 15px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-action {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .recovery-banner {
            background: linear-gradient(90deg, #00b09b, #96c93d);
            color: #000;
            padding: 10px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dashboard Gamificado -->
        <div class="dash-bar">
            <div class="dash-item" id="lives-disp">❤️ ❤️ ❤️</div>
            <div class="dash-item fire-streak">🔥 Racha: <span id="streak-disp">0</span></div>
            <div class="dash-item" style="color: var(--secondary);">⭐ <span id="score-disp">0</span> pts</div>
        </div>

        <div class="recovery-banner" id="rec-banner">
            🎉 ¡Racha de 3 aciertos! ¡Recuperaste 1 Vida extra! ❤️
        </div>

        <!-- Tarjeta Principal -->
        <div class="card" id="main-card"></div>
    </div>

    <script>
        // SINTETIZADOR DE AUDIO
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'powerup') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            }
        }

        // BASE DE DATOS EXTENSA Y VARIADA CON MÚLTIPLES PREGUNTAS E ILUSTRACIONES
        const modulos = [
            {
                zona: "Músculos Faciales y Masticación",
                leccion: [
                    {
                        nombre: "Masetero",
                        ubicacion: "Lateral posterior de la mandíbula, desde el arco cigomático hasta el ángulo mandibular.",
                        funcion: "Potente elevador de la mandíbula en la masticación y cierre bucal.",
                        palpacion: "Aprieta las muelas con fuerza y siente la masa rígida abultarse en tus mejillas.",
                        estetica: "Zona clave de bruxismo y masajes descontracturantes faciales."
                    },
                    {
                        nombre: "Frontal",
                        ubicacion: "Parte anterior del cráneo, zona de la frente.",
                        funcion: "Eleva las cejas y crea arrugas horizontales en la frente.",
                        palpacion: "Mira hacia arriba sorprendida y siente cómo trabaja tu frente.",
                        estetica: "Líneas de expresión horizontales tratadas con relajantes musculares."
                    }
                ],
                preguntas: [
                    {
                        tipo: "imagen",
                        svg: `<svg width="120" height="120" viewBox="0 0 100 100">
                            <circle cx="50" cy="45" r="32" stroke="#ff007f" stroke-width="3" fill="none"/>
                            <rect x="58" y="45" width="14" height="20" fill="#00f0ff" rx="3"/>
                            <circle cx="40" cy="40" r="4" fill="#ffffff"/>
                            <circle cx="60" cy="40" r="4" fill="#ffffff"/>
                        </svg>`,
                        pregunta: "Observa la ilustración: ¿Qué músculo resaltado en azul en el lateral de la cara interviene con máxima fuerza en la masticación?",
                        opciones: ["Frontal", "Masetero", "Orbicular de los ojos", "Bucinador"],
                        correcta: 1,
                        explicacion: "El Masetero es el elevador principal de la mandíbula."
                    },
                    {
                        tipo: "desarrollo",
                        pregunta: "¿Qué músculo de la frente eleva las cejas y genera arrugas horizontales de sorpresa?",
                        pista: "Empieza por 'F' y da nombre a la zona facial superior.",
                        respuestaCorrecta: "frontal",
                        explicacion: "El músculo Frontal es el elevador de las cejas y la frente."
                    },
                    {
                        tipo: "opciones",
                        pregunta: "Al cerrar fuertemente los párpados protegiendo el ojo, ¿qué músculo esfínter está trabajando en todo el contorno ocular?",
                        opciones: ["Orbicular de los Ojos", "Corrugador", "Risorio", "Masetero"],
                        correcta: 0,
                        explicacion: "El Orbicular de los Ojos rodea la órbita permitiendo el parpadeo y cierre ocular."
                    }
                ]
            },
            {
                zona: "Hombros, Espalda y Extremidades",
                leccion: [
                    {
                        nombre: "Deltoides",
                        ubicacion: "Parte superior y lateral del hombro en forma de semi-cono.",
                        funcion: "Abducción del brazo (elevarlo lateralmente) y estabilización de la articulación.",
                        palpacion: "Levanta el brazo en 90° lateralmente y palpa la cúpula de tu hombro.",
                        estetica: "Tonificación del contorno superior del brazo y hombros."
                    }
                ],
                preguntas: [
                    {
                        tipo: "imagen",
                        svg: `<svg width="120" height="120" viewBox="0 0 100 100">
                            <path d="M 30 75 L 38 35 L 50 25 L 62 35 L 70 75" stroke="#ffffff" stroke-width="3" fill="none"/>
                            <path d="M 20 45 Q 30 30 38 35 L 30 60 Z" fill="#ff007f" stroke="#00f0ff" stroke-width="2"/>
                        </svg>`,
                        pregunta: "Observa la ilustración del hombro: ¿Qué músculo en forma de triángulo resaltado eleva el brazo lateralmente?",
                        opciones: ["Bíceps", "Deltoides", "Trapecio", "Tríceps"],
                        correcta: 1,
                        explicacion: "El Deltoides cubre la articulación del hombro y realiza la abducción del brazo."
                    },
                    {
                        tipo: "desarrollo",
                        pregunta: "Escribe el nombre del músculo que forma un 'cordón' diagonal en el cuello al girar la cabeza hacia un lado:",
                        pista: "Puedes usar la sigla ECOM o escribir Esternocleidomastoideo.",
                        respuestaCorrecta: "esternocleidomastoideo",
                        explicacion: "El Esternocleidomastoideo (ECOM) permite la rotación e inclinación cervical."
                    }
                ]
            }
        ];

        let iModulo = 0;
        let iPregunta = 0;
        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let respondido = false;

        function actualizarDash() {
            document.getElementById('score-disp').innerText = puntos;
            document.getElementById('streak-disp').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-disp').innerText = h;
        }

        function mostrarLeccion() {
            const mod = modulos[iModulo];
            let html = `
                <div class="mode-badge">📖 Módulo de Estudio</div>
                <h2>${mod.zona}</h2>
                <p style="font-size:13px; color:var(--text-sub); margin-bottom:15px;">Estudia las fichas antes de iniciar los retos interactivos:</p>
            `;

            mod.leccion.forEach(m => {
                html += `
                    <div class="study-box">
                        <div class="study-title">⚡ ${m.nombre}</div>
                        <div class="study-detail"><span class="study-label">📍 Ubicación:</span> ${m.ubicacion}</div>
                        <div class="study-detail"><span class="study-label">⚙️ Función:</span> ${m.funcion}</div>
                        <div class="study-detail"><span class="study-label">🤚 Reconocimiento:</span> ${m.palpacion}</div>
                        <div class="study-detail"><span class="study-label">✨ Relevancia Estética/Salud:</span> ${m.estetica}</div>
                    </div>
                `;
            });

            html += `<button class="btn-action" onclick="iniciarQuiz()">¡Iniciar Desafíos! 🎯</button>`;
            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function iniciarQuiz() {
            iPregunta = 0;
            cargarPregunta();
        }

        function cargarPregunta() {
            respondido = false;
            const q = modulos[iModulo].preguntas[iPregunta];

            let html = `<div class="mode-badge">🎯 Desafío Interactivo</div>`;

            if (q.tipo === 'imagen') {
                html += `<div class="svg-box">${q.svg}</div>`;
            }

            html += `<div style="font-size:16px; font-weight:600; margin-bottom:16px; line-height:1.45;">${q.pregunta}</div>`;

            if (q.tipo === 'desarrollo') {
                if(q.pista) html += `<div style="font-size:12px; color:var(--secondary); margin-bottom:8px;">💡 Pista: ${q.pista}</div>`;
                html += `<input type="text" id="user-input" class="input-text" placeholder="Escribe tu respuesta aquí...">`;
                html += `<button class="btn-action" onclick="evaluarDesarrollo()">Comprobar Respuesta ✔️</button>`;
            } else {
                html += `<div class="btn-grid">`;
                q.opciones.forEach((op, idx) => {
                    html += `<button class="btn-opt" onclick="evaluarOpcion(${idx}, this)">${String.fromCharCode(65+idx)}) ${op}</button>`;
                });
                html += `</div>`;
            }

            html += `<div id="feedback" style="margin-top:15px; font-size:13px; display:none; background:rgba(5,2,15,0.85); padding:14px; border-radius:12px; border:1px solid var(--border);"></div>`;
            html += `<button class="btn-action" id="btn-next" style="display:none;" onclick="siguiente()">Siguiente ➔</button>`;

            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function procesarResultado(esCorrecto, explicacion) {
            const fb = document.getElementById('feedback');
            if (esCorrecto) {
                playSound('correct');
                racha++;
                puntos += 100 + (racha * 20);

                if (racha % 3 === 0 && vidas < 3) {
                    vidas++;
                    playSound('powerup');
                    const banner = document.getElementById('rec-banner');
                    banner.style.display = 'block';
                    setTimeout(() => banner.style.display = 'none', 3000);
                }
                fb.innerHTML = `<span style="color:var(--correct); font-weight:800;">¡EXCELENTE! 🎉</span><br>${explicacion}`;
            } else {
                playSound('wrong');
                racha = 0;
                vidas--;
                fb.innerHTML = `<span style="color:var(--wrong); font-weight:800;">INCORRECTO ❌</span><br>${explicacion}`;
            }

            fb.style.display = 'block';
            actualizarDash();

            if (vidas > 0) {
                document.getElementById('btn-next').style.display = 'block';
            } else {
                setTimeout(gameOver, 1200);
            }
        }

        function evaluarOpcion(idxOpt, btn) {
            if (respondido) return;
            respondido = true;
            const q = modulos[iModulo].preguntas[iPregunta];
            const btns = document.querySelectorAll('.btn-opt');

            if (idxOpt === q.correcta) {
                btn.classList.add('correct');
                procesarResultado(true, q.explicacion);
            } else {
                btn.classList.add('wrong');
                btns[q.correcta].classList.add('correct');
                procesarResultado(false, q.explicacion);
            }
        }

        function evaluarDesarrollo() {
            if (respondido) return;
            respondido = true;

            const q = modulos[iModulo].preguntas[iPregunta];
            const val = document.getElementById('user-input').value.trim().toLowerCase();

            if (val.includes(q.respuestaCorrecta) || val.includes("ecom")) {
                procesarResultado(true, q.explicacion);
            } else {
                procesarResultado(false, `La respuesta correcta era: <strong>${q.respuestaCorrecta}</strong>.<br>${q.explicacion}`);
            }
        }

        function siguiente() {
            iPregunta++;
            if (iPregunta < modulos[iModulo].preguntas.length) {
                cargarPregunta();
            } else {
                iModulo++;
                if (iModulo < modulos.length) {
                    mostrarLeccion();
                } else {
                    victoria();
                }
            }
        }

        function gameOver() {
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--wrong);">💔 ¡SIN VIDAS DISPONIBLES!</h2>
                    <p style="font-size:15px;">Puntaje acumulado: <strong>${puntos} pts</strong></p>
                    <p style="font-size:13px; color:var(--text-sub);">Revisa las fichas de lección para consolidar tu aprendizaje.</p>
                    <button class="btn-action" onclick="location.reload()">Reintentar 🔄</button>
                </div>
            `;
        }

        function victoria() {
            playSound('powerup');
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--correct);">🏆 ¡DESAFÍO COMPLETADO!</h2>
                    <p style="font-size:16px;">Puntaje Final: <strong>${puntos} pts</strong></p>
                    <p style="font-size:13px; color:#e0f7fa;">Has dominado las preguntas visuales, de desarrollo y de selección múltiple.</p>
                    <button class="btn-action" onclick="location.reload()">Volver a Jugar 🔄</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', mostrarLeccion);
    </script>
</body>
</html>
