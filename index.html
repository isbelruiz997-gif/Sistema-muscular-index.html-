<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoMaster - Juego & Estudio Muscular</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #f43f5e;
            --accent: #38bdf8;
            --correct: #10b981;
            --wrong: #ef4444;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Dashboard de Vidas y Racha */
        .dash-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
        }

        .dash-item {
            font-size: 14px;
            font-weight: bold;
        }

        .fire { color: #ffb703; }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .mode-title {
            color: var(--accent);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #fb7185;
        }

        /* Estilos Modo Estudio (Flashcards) */
        .study-box {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .study-item {
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.4;
        }

        .study-label {
            font-weight: bold;
            color: var(--accent);
        }

        /* Estilos Modo Quiz */
        .q-text {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-opt {
            background-color: #334155;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }

        .btn-opt.correct { background-color: var(--correct) !important; color: white; }
        .btn-opt.wrong { background-color: var(--wrong) !important; color: white; }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            cursor: pointer;
        }

        .hint-text {
            background-color: #0d1527;
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 12px;
            display: none;
        }

        .recovery-banner {
            background-color: #064e3b;
            color: #a7f3d0;
            border: 1px solid #10b981;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dashboard Gamificado -->
        <div class="dash-bar">
            <div class="dash-item" id="lives-disp">❤️ ❤️ ❤️</div>
            <div class="dash-item fire">🔥 Racha: <span id="streak-disp">0</span></div>
            <div class="dash-item" style="color: var(--accent);">⭐ <span id="score-disp">0</span> pts</div>
        </div>

        <div class="recovery-banner" id="rec-banner">
            🎉 ¡Racha de 3 aciertos! Recuperaste 1 Vida extra ❤️
        </div>

        <!-- Tarjeta Dinámica de Juego -->
        <div class="card" id="main-card">
            <!-- El contenido cambia dinámicamente entre Lección y Examen -->
        </div>
    </div>

    <script>
        const modulos = [
            {
                zona: "Músculos Faciales & Masticación",
                leccion: [
                    {
                        nombre: "Masetero",
                        ubicacion: "Lateral posterior de la mandíbula.",
                        funcion: "Es el músculo principal de la masticación. Aprieta los dientes con fuerza."
                    },
                    {
                        nombre: "Orbicular de los Labios",
                        ubicacion: "Alrededor de la boca.",
                        funcion: "Permite proyectar los labios para soplar, silbar o besar."
                    },
                    {
                        nombre: "Corrugador del Supercilio",
                        ubicacion: "Sobre las cejas (entrecejo).",
                        funcion: "Arruga el ceño hacia adentro al concentrarte o molestarte."
                    }
                ],
                preguntas: [
                    {
                        pregunta: "¿Qué músculo es el principal responsable de la fuerza en la masticación cuando muerdes alimentos?",
                        pista: "Se ubica en los laterales de la mandíbula y se endurece al apretar los dientes.",
                        opciones: ["Orbicular de los labios", "Masetero", "Corrugador", "Trapecio"],
                        correcta: 1,
                        explicacion: "El Masetero se inserta en la mandíbula y ejerce la presión necesaria para masticar."
                    },
                    {
                        pregunta: "¿Qué músculo utilizas principalmente para silbar, soplar o besar?",
                        pista: "Forma un anillo muscular completo alrededor de los labios.",
                        opciones: ["Masetero", "Cigomático", "Orbicular de los Labios", "Frontal"],
                        correcta: 2,
                        explicacion: "El Orbicular de los Labios rodea la boca y permite el cierre y la proyección de los labios."
                    }
                ]
            },
            {
                zona: "Cuello, Espalda y Brazos",
                leccion: [
                    {
                        nombre: "Esternocleidomastoideo (ECOM)",
                        ubicacion: "Anterolateral del cuello.",
                        funcion: "Permite girar la cabeza hacia los lados e inclinar el cuello."
                    },
                    {
                        nombre: "Deltoides",
                        ubicacion: "Parte superior del hombro.",
                        funcion: "Músculo clave para levantar el brazo hacia los lados (abducción)."
                    }
                ],
                preguntas: [
                    {
                        pregunta: "Si giras tu cabeza hacia la derecha para mirar sobre tu hombro, ¿qué músculo resalta en tu cuello?",
                        pista: "Va desde el esternón/clavícula hasta detrás de la oreja.",
                        opciones: ["Deltoides", "Esternocleidomastoideo", "Masetero", "Recto Abdominal"],
                        correcta: 1,
                        explicacion: "El Esternocleidomastoideo permite la rotación y flexión del cuello."
                    },
                    {
                        pregunta: "Al levantar el brazo lateralmente hacia arriba, ¿qué músculo en forma de capuchón trabaja en el hombro?",
                        pista: "Cubre toda la articulación superior del hombro.",
                        opciones: ["Deltoides", "Bíceps", "Orbicular", "Platisma"],
                        correcta: 0,
                        explicacion: "El Deltoides eleva el brazo y le da la forma redondeada al hombro."
                    }
                ]
            }
        ];

        let iModulo = 0;
        let iPregunta = 0;
        let puntos = 0;
        let racha = 0;
        let vidas = 3;
        let respondido = false;

        function actualizarDash() {
            document.getElementById('score-disp').innerText = puntos;
            document.getElementById('streak-disp').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";
            document.getElementById('lives-disp').innerText = h;
        }

        function mostrarLeccion() {
            const mod = modulos[iModulo];
            let htmlLeccion = `
                <div class="mode-title">📖 Módulo de Aprendizaje</div>
                <h2>${mod.zona}</h2>
                <p style="font-size:13px; color:var(--subtext); margin-bottom:15px;">Repasa estos conceptos antes de iniciar el desafío interactivo:</p>
            `;

            mod.leccion.forEach(m => {
                htmlLeccion += `
                    <div class="study-box">
                        <div style="font-weight:bold; color:#fda4af; font-size:15px; margin-bottom:4px;">🔹 ${m.nombre}</div>
                        <div class="study-item"><span class="study-label">📍 Ubicación:</span> ${m.ubicacion}</div>
                        <div class="study-item"><span class="study-label">⚙️ Función:</span> ${m.funcion}</div>
                    </div>
                `;
            });

            htmlLeccion += `<button class="btn-action" onclick="iniciarQuiz()">¡Estoy lista, comenzar examen! 🎯</button>`;
            document.getElementById('main-card').innerHTML = htmlLeccion;
            actualizarDash();
        }

        function iniciarQuiz() {
            iPregunta = 0;
            cargarPregunta();
        }

        function cargarPregunta() {
            respondido = false;
            const q = modulos[iModulo].preguntas[iPregunta];

            let html = `
                <div class="mode-title">🎯 Desafío de Aprendizaje</div>
                <div class="q-text">${q.pregunta}</div>

                <button style="background:none; border:1px dashed var(--accent); color:var(--accent); padding:5px 10px; border-radius:6px; font-size:12px; margin-bottom:10px; cursor:pointer;" onclick="document.getElementById('pista').style.display='block'">💡 Ver Pista</button>
                <div class="hint-text" id="pista">Pista: ${q.pista}</div>

                <div class="btn-grid">
            `;

            q.opciones.forEach((op, idx) => {
                html += `<button class="btn-opt" onclick="evaluar(${idx}, this)">${String.fromCharCode(65+idx)}) ${op}</button>`;
            });

            html += `</div><div id="feedback" style="margin-top:15px; font-size:13px; display:none;"></div>`;
            html += `<button class="btn-action" id="btn-next" style="display:none;" onclick="siguiente()">Siguiente ➔</button>`;

            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function evaluar(idxOpt, btn) {
            if (respondido) return;
            respondido = true;

            const q = modulos[iModulo].preguntas[iPregunta];
            const fb = document.getElementById('feedback');
            const btns = document.querySelectorAll('.btn-opt');

            if (idxOpt === q.correcta) {
                btn.classList.add('correct');
                racha++;
                puntos += 100 + (racha * 20);

                if (racha % 3 === 0 && vidas < 3) {
                    vidas++;
                    const banner = document.getElementById('rec-banner');
                    banner.style.display = 'block';
                    setTimeout(() => banner.style.display = 'none', 3000);
                }
                fb.innerHTML = `<span style="color:var(--correct); font-weight:bold;">¡Correcto!</span> ${q.explicacion}`;
            } else {
                btn.classList.add('wrong');
                btns[q.correcta].classList.add('correct');
                racha = 0;
                vidas--;
                fb.innerHTML = `<span style="color:var(--wrong); font-weight:bold;">Incorrecto.</span> ${q.explicacion}`;
            }

            fb.style.display = 'block';
            actualizarDash();

            if (vidas > 0) {
                document.getElementById('btn-next').style.display = 'block';
            } else {
                setTimeout(gameOver, 1200);
            }
        }

        function siguiente() {
            iPregunta++;
            if (iPregunta < modulos[iModulo].preguntas.length) {
                cargarPregunta();
            } else {
                iModulo++;
                if (iModulo < modulos.length) {
                    mostrarLeccion();
                } else {
                    victoria();
                }
            }
        }

        function gameOver() {
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--wrong);">💔 ¡Te has quedado sin vidas!</h2>
                    <p style="font-size:14px;">Lograste acumular <strong>${puntos} puntos</strong>.</p>
                    <p style="font-size:12px; color:var(--subtext);">Repasar las fichas de estudio te ayudará a no fallar la próxima vez.</p>
                    <button class="btn-action" onclick="location.reload()">Reintentar Nivel 🔄</button>
                </div>
            `;
        }

        function victoria() {
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--correct);">🏆 ¡Excelente Trabajo!</h2>
                    <p style="font-size:15px;">Puntaje Final: <strong>${puntos} pts</strong></p>
                    <p style="font-size:13px; color:#a7f3d0;">Has completado los módulos de estudio y preguntas sobre el sistema muscular.</p>
                    <button class="btn-action" onclick="location.reload()">Volver a Repasar 🔄</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', mostrarLeccion);
    </script>
</body>
</html>
