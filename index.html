<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoMaster Masterclass Elite</title>
    <style>
        :root {
            --primary: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.6);
            --secondary: #00f0ff;
            --accent: #7000ff;
            --correct: #00ff87;
            --wrong: #ff0055;
            --gold: #ffb700;
            --card-bg: rgba(15, 10, 30, 0.92);
            --border: rgba(255, 255, 255, 0.18);
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(-45deg, #05020a, #120524, #1f043b, #031022);
            background-size: 400% 400%;
            animation: gradientBG 14s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .dash-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 5, 22, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 22px;
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
        }

        .dash-item { font-size: 13px; font-weight: 800; }
        .fire-streak { color: var(--gold); text-shadow: 0 0 10px var(--gold); }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            margin-bottom: 15px;
        }

        .mode-badge {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff75c3, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* CONTENEDOR DE VIDEO EDUCATIVO */
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--secondary);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* FIGURAS ANATÓMICAS MEJORADAS */
        .svg-box {
            width: 100%;
            height: 190px;
            background: rgba(4, 2, 12, 0.9);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
        }

        .study-box {
            background: rgba(12, 6, 26, 0.85);
            border: 1px solid var(--border);
            border-left: 4px solid var(--secondary);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .study-title { font-weight: 800; color: #ff75c3; font-size: 15px; margin-bottom: 6px; }
        .study-detail { font-size: 12px; line-height: 1.45; margin-bottom: 5px; color: var(--text-sub); }
        .study-label { font-weight: 700; color: var(--secondary); }

        .btn-grid { display: flex; flex-direction: column; gap: 10px; }

        .btn-opt {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px;
            border-radius: 14px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .btn-opt.correct {
            background: linear-gradient(90deg, #00b09b, #96c93d) !important;
            border-color: var(--correct) !important;
            color: #000;
            font-weight: 800;
        }

        .btn-opt.wrong {
            background: linear-gradient(90deg, #ff0055, #ff5252) !important;
            border-color: #ff5252 !important;
            color: white;
        }

        .input-text {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid var(--secondary);
            background: rgba(4, 2, 12, 0.95);
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-action {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 15px;
            margin-top: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-menu {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--secondary);
            color: white;
            padding: 16px;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 800;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-menu:active { transform: scale(0.97); background: rgba(0, 240, 255, 0.2); }

        .recovery-banner {
            background: linear-gradient(90deg, #00b09b, #96c93d);
            color: #000;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>

        // SINTETIZADOR DE AUDIO (Fanfarria alegre)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (type === 'correct') {
                const notas = [523.25, 659.25, 783.99, 1046.50];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.08));
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (idx * 0.08));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.08) + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.08));
                    osc.stop(audioCtx.currentTime + (idx * 0.08) + 0.25);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'powerup') {
                const notas = [440, 554.37, 659.25, 880];
                notas.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (idx * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.06) + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (idx * 0.06));
                    osc.stop(audioCtx.currentTime + (idx * 0.06) + 0.2);
                });
            }
        }

        let regClave = 'facial';

        let puntos = 0;

        let vidas = 3;
        let respondido = false;
        let preguntasFallidas = []; // Fila para recuperar preguntas fallidas

        function mostrarMenu() {
            document.getElementById('dash-bar').style.display = 'none';
            preguntasFallidas = [];
            modoRepasoFallidas = false;
            document.getElementById('main-card').innerHTML = `
                <div class="mode-badge">🧠 Masterclass Anatómica</div>
                <h2>Seleccione Área de Estudio</h2>

        function seleccionarRegion(clave) {

            puntos = 0;
            racha = 0;
            vidas = 3;
            preguntasFallidas = [];
            modoRepasoFallidas = false;
            document.getElementById('dash-bar').style.display = 'flex';

        function actualizarDash() {
            document.getElementById('score-disp').innerText = puntos;
            document.getElementById('streak-disp').innerText = racha;
            let h = "";
            for(let i=0; i<vidas; i++) h += "❤️ ";
            for(let i=vidas; i<3; i++) h += "🖤 ";

        }

        function mostrarLeccionYVideo() {
            const mod = bancoMaster[regClave];
            let html = `
                <div class="mode-badge">🎬 Video & Lección Magistral</div>
                <h2>${mod.nombre}</h2>
                
                <!-- Video Educativo Integrado -->
                <div class="video-box">
                    <iframe src="${mod.videoUrl}" allowfullscreen></iframe>
                </div>
                <p style="font-size:12px; color:var(--secondary); margin-bottom:12px;">💡 Revise la disección en video y las fichas técnicas antes del examen:</p>
            `;

            mod.leccion.forEach(m => {
                html += `
                    <div class="study-box">
                        <div class="study-title">⚡ ${m.nombre}</div>
                        <div class="study-detail"><span class="study-label">📍 Ubicación:</span> ${m.ubicacion}</div>

                `;
            });

            html += `<button class="btn-action" onclick="iniciarQuiz()">¡Iniciar Examen Riguroso! 🎯</button>`;
            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function iniciarQuiz() {
            iPregunta = 0;
            preguntasFallidas = [];
            modoRepasoFallidas = false;
            cargarPregunta();
        }

        function cargarPregunta() {
            respondido = false;
            let q;
            if (!modoRepasoFallidas) {
                q = bancoMaster[regClave].preguntas[iPregunta];
            } else {
                q = preguntasFallidas[iPregunta];
            }

            let html = `<div class="mode-badge">${modoRepasoFallidas ? '🔄 Rueda de Recuperación de Fallos' : '🎯 Examen Interactivo'}</div>`;

            if (q.tipo === 'imagen') {
                html += `<svg-box class="svg-box" style="display:flex; justify-content:center; align-items:center; width:100%; height:190px; background:rgba(4,2,12,0.9); border-radius:18px; margin-bottom:15px; border:1px solid rgba(0,240,255,0.3);">${q.svg}</svg-box>`;
            }

            html += `<div style="font-size:15px; font-weight:600; margin-bottom:16px; line-height:1.45;">${q.pregunta}</div>`;

            if (q.tipo === 'desarrollo') {
                if(q.pista) html += `<div style="font-size:12px; color:var(--secondary); margin-bottom:8px;">💡 Pista: ${q.pista}</div>`;
                html += `<input type="text" id="user-input" class="input-text" placeholder="Escriba su respuesta...">`;
                html += `<button class="btn-action" onclick="evaluarDesarrollo()">Comprobar Respuesta ✔️</button>`;
            } else {
                html += `<div class="btn-grid">`;
                q.opciones.forEach((op, idx) => {
                    html += `<button class="btn-opt" onclick="evaluarOpcion(${idx}, this)">${String.fromCharCode(65+idx)}) ${op}</button>`;
                });
                html += `</div>`;
            }

            html += `<div id="feedback" style="margin-top:15px; font-size:13px; display:none; background:rgba(4,2,12,0.9); padding:14px; border-radius:12px; border:1px solid var(--border);"></div>`;
            html += `<button class="btn-action" id="btn-next" style="display:none;" onclick="siguiente()">Siguiente ➔</button>`;

            document.getElementById('main-card').innerHTML = html;
            actualizarDash();
        }

        function procesarResultado(esCorrecto, explicacion, qObj) {
            const fb = document.getElementById('feedback');
            if (esCorrecto) {
                playSound('correct');
                racha++;
                puntos += 100 + (racha * 20);

                if (racha % 3 === 0 && vidas < 3) {
                    vidas++;
                    playSound('powerup');
                    const banner = document.getElementById('rec-banner');
                    banner.style.display = 'block';
                    setTimeout(() => banner.style.display = 'none', 3000);
                }
                fb.innerHTML = `<span style="color:var(--correct); font-weight:800;">¡EXCELENTE! 🎉</span><br>${explicacion}`;
            } else {
                playSound('wrong');
                racha = 0;
                vidas--;
                // Guardar para recuperar más adelante si no está ya en la lista
                if (!preguntasFallidas.includes(qObj)) {
                    preguntasFallidas.push(qObj);
                }
                fb.innerHTML = `<span style="color:var(--wrong); font-weight:800;">INCORRECTO ❌ (Pregunta guardada para recuperación)</span><br>${explicacion}`;
            }

            fb.style.display = 'block';
            actualizarDash();

            if (vidas > 0) {
                document.getElementById('btn-next').style.display = 'block';
            } else {
                setTimeout(gameOver, 1200);
            }
        }

        function evaluarOpcion(idxOpt, btn) {
            if (respondido) return;
            respondido = true;
            let q = !modoRepasoFallidas ? bancoMaster[regClave].preguntas[iPregunta] : preguntasFallidas[iPregunta];
            const btns = document.querySelectorAll('.btn-opt');

            if (idxOpt === q.correcta) {
                btn.classList.add('correct');
                procesarResultado(true, q.explicacion, q);
            } else {
                btn.classList.add('wrong');
                btns[q.correcta].classList.add('correct');
                procesarResultado(false, q.explicacion, q);
            }
        }

        function evaluarDesarrollo() {
            if (respondido) return;
            respondido = true;
            let q = !modoRepasoFallidas ? bancoMaster[regClave].preguntas[iPregunta] : preguntasFallidas[iPregunta];
            const val = document.getElementById('user-input').value.trim().toLowerCase();

            if (val.includes(q.respuestaCorrecta)) {
                procesarResultado(true, q.explicacion, q);
            } else {
                procesarResultado(false, `Respuesta correcta: <strong>${q.respuestaCorrecta}</strong>.<br>${q.explicacion}`, q);
            }
        }

        function siguiente() {
            iPregunta++;
            let maxPreguntas = !modoRepasoFallidas ? bancoMaster[regClave].preguntas.length : preguntasFallidas.length;

            if (iPregunta < maxPreguntas) {
                cargarPregunta();
            } else {
                // Si terminamos las normales y hay fallidas pendientes, entramos en modo recuperación de fallos
                if (!modoRepasoFallidas && preguntasFallidas.length > 0) {
                    modoRepasoFallidas = true;
                    iPregunta = 0;
                    alert("🔄 ¡Fase de Recuperación! Repasemos las preguntas que falló para asegurar su aprendizaje.");
                    cargarPregunta();
                } else {
                    victoria();
                }
            }
        }

        function gameOver() {
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--wrong);">💔 ¡AGOTÓ SUS VIDAS!</h2>
                    <p style="font-size:14px;">Puntaje obtenido: <strong>${puntos} pts</strong></p>
                    <button class="btn-action" onclick="mostrarMenu()">Volver al Menú Principal 🏠</button>
                </div>
            `;
        }

        function victoria() {
            playSound('powerup');
            document.getElementById('main-card').innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:var(--correct);">🏆 ¡MASTERCLASS COMPLETADA!</h2>
                    <p style="font-size:15px;">Puntaje Final: <strong>${puntos} pts</strong></p>
                    <p style="font-size:13px; color:#e0f7fa;">Ha superado con éxito las lecciones, videos y la ronda de recuperación de fallos.</p>
                    <button class="btn-action" onclick="mostrarMenu()">Volver al Menú Principal 🏠</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', mostrarMenu);
    </script>
</body>
</html>
